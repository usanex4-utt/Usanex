<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Reels | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/reels.css?v=2"
    >
</head>

<body>

<div class="reels-page">

    <!-- =====================================================
         TOP HEADER
    ====================================================== -->

    <header class="reels-header">

        <div class="reels-title">
            Reels
        </div>

        <button
            type="button"
            class="create-reel-button"
            id="createReelButton"
            aria-label="Create reel"
            title="Create reel"
        >
            +
        </button>

    </header>


    <!-- =====================================================
         REELS CONTENT
    ====================================================== -->

    <main class="reels-container">

        <article
            class="reel-card"
            data-reel-id="demo-1"
        >

            <!-- VIDEO -->

            <div class="reel-video">

                <div class="video-placeholder">

                    <div class="placeholder-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                        >
                            <rect
                                x="3"
                                y="3"
                                width="18"
                                height="18"
                                rx="3"
                            ></rect>

                            <path d="M9 8l7 4-7 4V8z"></path>
                        </svg>

                    </div>

                    <span>
                        Your reel will appear here
                    </span>

                </div>

            </div>


            <!-- =================================================
                 RIGHT ACTIONS
            ================================================== -->

            <div class="reel-actions">

                <!-- LIKE -->

                <button
                    type="button"
                    class="reel-action"
                    data-action="like"
                    aria-label="Like"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >
                        <path
                            d="M20.8 8.7c0 5.5-8.8 11-8.8 11S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 8 4c1.7 0 3.2.9 4 2.2A4.7 4.7 0 0 1 20.8 8.7z"
                        ></path>
                    </svg>

                    <span>
                        0
                    </span>

                </button>


                <!-- COMMENT -->

                <button
                    type="button"
                    class="reel-action"
                    data-action="comment"
                    aria-label="Comment"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >
                        <path
                            d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.7 8.7 0 0 1-3.5-.7L4 20l1.4-3.5A7.3 7.3 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5z"
                        ></path>
                    </svg>

                    <span>
                        0
                    </span>

                </button>


                <!-- SHARE -->

                <button
                    type="button"
                    class="reel-action"
                    data-action="share"
                    aria-label="Share"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >
                        <path d="M21 3L10 14"></path>
                        <path d="M21 3l-7 18-4-7-7-4 18-7z"></path>
                    </svg>

                    <span>
                        Share
                    </span>

                </button>


                <!-- SAVE -->

                <button
                    type="button"
                    class="reel-action"
                    data-action="save"
                    aria-label="Save"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >
                        <path
                            d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5z"
                        ></path>
                    </svg>

                    <span>
                        Save
                    </span>

                </button>


                <!-- DOWNLOAD -->

                <button
                    type="button"
                    class="reel-action"
                    data-action="download"
                    aria-label="Download"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >
                        <path d="M12 3v12"></path>

                        <path d="M7 10l5 5 5-5"></path>

                        <path d="M5 21h14"></path>
                    </svg>

                    <span>
                        Download
                    </span>

                </button>


                <!-- MORE -->

                <button
                    type="button"
                    class="reel-action more-action"
                    data-action="more"
                    aria-label="More"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle
                            cx="5"
                            cy="12"
                            r="1"
                        ></circle>

                        <circle
                            cx="12"
                            cy="12"
                            r="1"
                        ></circle>

                        <circle
                            cx="19"
                            cy="12"
                            r="1"
                        ></circle>
                    </svg>

                </button>

            </div>


            <!-- =================================================
                 USER INFORMATION
            ================================================== -->

            <div class="reel-info">

                <div class="reel-user-row">

                    <div class="reel-avatar">
                        U
                    </div>

                    <div class="reel-user-details">

                        <strong>
                            Usanex User
                        </strong>

                        <span>
                            @usanex
                        </span>

                    </div>

                    <button
                        type="button"
                        class="follow-button"
                        id="followButton"
                    >
                        Follow
                    </button>

                </div>


                <p class="reel-caption">
                    Welcome to Usanex Reels.
                </p>


                <!-- INTEREST CONTROLS -->

                <div class="interest-controls">

                    <button
                        type="button"
                        class="interest-button"
                        id="interestedButton"
                    >
                        Interested
                    </button>

                    <button
                        type="button"
                        class="interest-button"
                        id="notInterestedButton"
                    >
                        Not interested
                    </button>

                </div>


                <!-- AUDIO -->

                <div class="reel-audio">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                    >
                        <path d="M9 18V6l10-2v12"></path>

                        <circle
                            cx="6"
                            cy="18"
                            r="3"
                        ></circle>

                        <circle
                            cx="16"
                            cy="16"
                            r="3"
                        ></circle>
                    </svg>

                    <span>
                        Original audio
                    </span>

                </div>

            </div>

        </article>

    </main>


    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="bottom-nav">

        <!-- HOME -->

        <button
            type="button"
            class="nav-item"
            id="homeNav"
            aria-label="Home"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5.5 9.5V21h13V9.5"></path>
            </svg>

            <span>
                Home
            </span>

        </button>


        <!-- REEL -->

        <button
            type="button"
            class="nav-item active"
            id="reelNav"
            aria-label="Reel"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <rect
                    x="3"
                    y="4"
                    width="18"
                    height="16"
                    rx="3"
                ></rect>

                <path d="M8 4l3 5"></path>
                <path d="M14 4l3 5"></path>
                <path d="M10 12l5 3-5 3v-6z"></path>
            </svg>

            <span>
                Reel
            </span>

        </button>


        <!-- SEARCH -->

        <button
            type="button"
            class="nav-item"
            id="searchNav"
            aria-label="Search"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <circle
                    cx="11"
                    cy="11"
                    r="7"
                ></circle>

                <path d="M20 20l-4-4"></path>
            </svg>

            <span>
                Search
            </span>

        </button>


        <!-- NOTIFICATION -->

        <button
            type="button"
            class="nav-item"
            id="notificationNav"
            aria-label="Notification"
        >

            <span class="notification-icon-wrapper">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path d="M10 21h4"></path>

                </svg>

                <span
                    class="notification-dot"
                    id="notificationDot"
                    hidden
                ></span>

            </span>

            <span>
                Notification
            </span>

        </button>


        <!-- PROFILE -->

        <button
            type="button"
            class="nav-item"
            id="profileNav"
            aria-label="Profile"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <circle
                    cx="12"
                    cy="8"
                    r="4"
                ></circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                ></path>

            </svg>

            <span>
                Profile
            </span>

        </button>

    </nav>

</div>


<script src="/static/js/reels.js?v=2"></script>


<!-- =====================================================
     REELS PAGE NAVIGATION
     Profile ALWAYS opens My Profile
====================================================== -->

<script>

document.addEventListener("DOMContentLoaded", () => {

    const homeNav =
        document.getElementById("homeNav");

    const reelNav =
        document.getElementById("reelNav");

    const searchNav =
        document.getElementById("searchNav");

    const notificationNav =
        document.getElementById("notificationNav");

    const profileNav =
        document.getElementById("profileNav");


    if (homeNav) {

        homeNav.addEventListener("click", () => {

            window.location.href = "/home";

        });

    }


    if (reelNav) {

        reelNav.addEventListener("click", () => {

            window.location.href = "/reels";

        });

    }


    if (searchNav) {

        searchNav.addEventListener("click", () => {

            window.location.href = "/search";

        });

    }


    if (notificationNav) {

        notificationNav.addEventListener("click", () => {

            window.location.href = "/notifications";

        });

    }


    /*
    =========================================================
       PROFILE
       ALWAYS → MY PROFILE
    =========================================================
    */

    if (profileNav) {

        profileNav.addEventListener("click", () => {

            window.location.href = "/my-profile";

        });

    }

});

</script>

</body>
</html>
