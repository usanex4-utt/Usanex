<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Usanex Reels</title>

    <!-- Reels CSS -->
    <link
        rel="stylesheet"
        href="/static/css/reels.css"
    >
</head>

<body>

    <main class="reels-page">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="reels-header">

            <button
                type="button"
                id="createReelButton"
                class="create-reel-button"
                aria-label="Create Reel"
                title="Create Reel"
            >
                +
            </button>

        </header>


        <!-- =================================================
             REELS CONTAINER
        ================================================== -->

        <section
            id="reelsContainer"
            class="reels-container"
            aria-label="Usanex Reels"
        >

            <!-- Reels are loaded by reels.js -->

        </section>


        <!-- =================================================
             BOTTOM NAVIGATION
        ================================================== -->

        <nav
            class="bottom-nav"
            aria-label="Main navigation"
        >

            <!-- HOME -->

            <button
                type="button"
                id="homeNav"
                class="nav-item"
                aria-label="Home"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path
                        d="M3 10.8 12 3l9 7.8"
                    />

                    <path
                        d="M5.5 9.5V21h13V9.5"
                    />

                    <path
                        d="M9.5 21v-6h5v6"
                    />
                </svg>

                <span>
                    Home
                </span>

            </button>


            <!-- REELS -->

            <button
                type="button"
                id="reelNav"
                class="nav-item active"
                aria-label="Reels"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="4"
                    />

                    <path
                        d="M8 3l4 5"
                    />

                    <path
                        d="M14 3l4 5"
                    />

                    <path
                        d="M3 8h18"
                    />

                    <path
                        d="m10 12 5 3-5 3v-6Z"
                        fill="currentColor"
                        stroke="none"
                    />

                </svg>

                <span>
                    Reels
                </span>

            </button>


            <!-- SEARCH -->

            <button
                type="button"
                id="searchNav"
                class="nav-item"
                aria-label="Search"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <circle
                        cx="10.8"
                        cy="10.8"
                        r="6.8"
                    />

                    <path
                        d="m16 16 5 5"
                    />

                </svg>

                <span>
                    Search
                </span>

            </button>


            <!-- NOTIFICATIONS -->

            <button
                type="button"
                id="notificationNav"
                class="nav-item"
                aria-label="Notifications"
            >

                <div class="notification-icon-wrapper">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.9"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <path
                            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                        />

                        <path
                            d="M10 21h4"
                        />

                    </svg>

                    <span
                        class="notification-dot"
                        aria-hidden="true"
                    ></span>

                </div>

                <span>
                    Notifications
                </span>

            </button>


            <!-- PROFILE -->

            <button
                type="button"
                id="profileNav"
                class="nav-item"
                aria-label="Profile"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                    />

                    <path
                        d="M4 21c.8-4.2 3.4-6.5 8-6.5s7.2 2.3 8 6.5"
                    />

                </svg>

                <span>
                    Profile
                </span>

            </button>

        </nav>

    </main>


    <!-- =================================================
         REELS JAVASCRIPT
    ================================================== -->

    <script
        src="/static/js/reels.js"
        defer
    ></script>

</body>
</html>
