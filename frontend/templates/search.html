<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/search.css?v=4"
    >
</head>

<body>

<div class="search-page">

    <main class="search-main">

        <!-- Search Box -->
        <div class="search-box">

            <svg
                class="search-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >
                <circle
                    cx="11"
                    cy="11"
                    r="7"
                ></circle>

                <path
                    d="M20 20l-4-4"
                ></path>
            </svg>

            <input
                type="search"
                id="searchInput"
                placeholder="Search with Usanex AI"
                autocomplete="off"
                maxlength="100"
            >

            <button
                type="button"
                id="clearSearch"
                class="clear-button"
                aria-label="Clear search"
                hidden
            >
                ×
            </button>

        </div>


        <!-- Search Status -->
        <div
            id="searchStatus"
            class="search-status"
        >
            Search people on Usanex
        </div>


        <!-- Search Results -->
        <section
            id="searchResults"
            class="search-results"
            aria-live="polite"
        ></section>

    </main>

</div>


<script src="/static/js/search.js?v=3"></script>

</body>
</html>
