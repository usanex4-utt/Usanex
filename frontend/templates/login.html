<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07152f"
    >

    <title>Login | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/auth.css"
    >
</head>

<body>

<div class="login-page">

    <!-- Background -->
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
    <div class="background-glow glow-three"></div>


    <!-- =========================================
         BRAND SECTION
    ========================================== -->

    <section class="brand-section">

        <div class="brand-content">

            <div class="hero-brand">

                <!-- U LOGO -->
                <div class="hero-logo">

                    <span class="logo-u">
                        U
                    </span>

                    <span class="logo-cut"></span>

                </div>


                <!-- WORDMARK -->
                <div class="hero-wordmark">

                    <span class="wordmark-text">
                        Usanex
                    </span>

                    <span class="wordmark-line"></span>

                </div>

            </div>


            <div class="tagline">
                More Than Just a Social App
            </div>


            <div class="connection-text">

                <span>
                    Real People
                </span>

                <span class="connection-line"></span>

                <span>
                    Real Connections
                </span>

            </div>


            <!-- Decorative objects -->
            <div class="brand-orb orb-one"></div>

            <div class="brand-orb orb-two"></div>

        </div>

    </section>



    <!-- =========================================
         LOGIN SECTION
    ========================================== -->

    <section class="login-section">

        <div class="login-card">


            <!-- CARD BRAND -->
            <div class="card-brand">

                <div class="small-logo">

                    <span class="small-logo-u">
                        U
                    </span>

                    <span class="small-logo-line"></span>

                </div>


                <div class="small-wordmark">

                    <span>
                        Usanex
                    </span>

                    <span class="small-wordmark-line"></span>

                </div>

            </div>



            <!-- HEADING -->
            <div class="login-heading">

                <h1>
                    <span>
                        Login
                    </span>
                    to Usanex
                </h1>

                <p>
                    Enter your username or mobile number
                    and password to continue.
                </p>

            </div>



            <!-- LOGIN FORM -->
            <form
                id="loginForm"
                class="login-form"
                autocomplete="on"
            >


                <!-- USERNAME / MOBILE -->
                <div class="input-group">

                    <label for="identifier">
                        Username or Mobile
                    </label>


                    <div class="input-box">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >

                                <circle
                                    cx="12"
                                    cy="8"
                                    r="4"
                                ></circle>

                                <path
                                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                                ></path>

                            </svg>

                        </span>


                        <input
                            type="text"
                            id="identifier"
                            name="identifier"
                            placeholder="Username or mobile"
                            autocomplete="username"
                            maxlength="100"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-box">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >

                                <rect
                                    x="4"
                                    y="10"
                                    width="16"
                                    height="11"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M8 10V7a4 4 0 018 0v3"
                                ></path>

                            </svg>

                        </span>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            maxlength="128"
                            required
                        >


                        <!-- PASSWORD TOGGLE -->
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- OPTIONS -->
                <div class="login-options">


                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span class="custom-checkbox"></span>

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="/forgot-password"
                        id="forgotPasswordLink"
                    >
                        Forgot password?
                    </a>

                </div>



                <!-- MESSAGE -->
                <div
                    id="loginMessage"
                    class="message"
                    hidden
                    role="alert"
                ></div>



                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span class="login-button-text">
                        Login
                    </span>

                    <span class="login-arrow">
                        →
                    </span>

                </button>

            </form>



            <!-- DIVIDER -->
            <div class="divider">

                <span></span>

                <b>
                    Or
                </b>

                <span></span>

            </div>



            <!-- REGISTER -->
            <div class="create-account">

                <span>
                    Don't have an account?
                </span>

                <a
                    href="/register"
                    id="registerLink"
                >
                    Create account
                </a>

            </div>


        </div>

    </section>

</div>



<script src="/static/js/auth.js"></script>

</body>

</html>
