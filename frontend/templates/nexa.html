
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080D20">

    <title>NEXA — AI Assistant</title>

    <link rel="stylesheet" href="/static/css/nexa.css">
    <script src="/static/js/nexa.js" defer></script>
</head>
<body>

<main class="nexa-app">

    <!-- HEADER -->
    <header class="header">
        <button class="back-btn" id="backBtn" aria-label="Back">←</button>

        <div class="header-title">Nexa<span>.</span></div>

        <div class="menu-wrap">
            <button class="menu-btn" id="menuBtn"
                    aria-label="Open menu" aria-expanded="false">⋮</button>

            <nav class="dropdown" id="dropdown" hidden>
                <button data-action="chat">💬 <span>Chat</span></button>
                <button data-action="private">🔒 <span>Private Chat</span></button>
                <button data-action="memory">🧠 <span>Memory</span></button>
                <button data-action="quick">⚡ <span>Quick Actions</span></button>
                <button data-action="settings">⚙️ <span>Settings</span></button>
            </nav>
        </div>
    </header>

    <!-- ASSISTANT BRAND -->
    <section class="hero">
        <div class="orb-area">
            <div class="orb-ring ring-outer"></div>
            <div class="orb-ring ring-inner"></div>

            <div class="orb">
                <div class="eyes"><i></i><i></i></div>
            </div>
        </div>

        <h1 class="logo">Nexa<span>.</span></h1>
        <p class="subtitle">AI ASSISTANT</p>

        <p class="welcome">Hello! Main NEXA hoon 💙</p>
        <p class="intro">
            Batao bhai, aaj main tumhari kya madad karun?
        </p>
    </section>

    <!-- CHAT MESSAGES -->
    <section class="conversation" id="conversation" aria-live="polite">
        <div class="assistant-message">
            <div class="avatar">N</div>
            <div class="message-content">
                <span class="sender">NEXA</span>
                <p>Kaise ho? 😊 Chat karein ya Usanex mein kuch karna hai?</p>
            </div>
        </div>
    </section>

    <!-- SIMPLE SUGGESTIONS -->
    <section class="suggestions">
        <button data-prompt="Hello NEXA, kaise ho?">Hello 👋</button>
        <button data-prompt="Meri shopping list banane mein madad karo">Shopping list</button>
        <button data-prompt="Couple Chat kholo">Couple Chat</button>
    </section>

    <!-- MESSAGE INPUT -->
    <form class="composer" id="chatForm">
        <input
            id="messageInput"
            type="text"
            placeholder="NEXA se baat karo..."
            maxlength="2000"
            autocomplete="off"
            aria-label="Message NEXA"
        >

        <button type="button" class="mic-btn" id="micBtn"
                aria-label="Voice input">🎙</button>

        <button type="submit" class="send-btn"
                aria-label="Send message">➤</button>
    </form>

    <p class="privacy-note">🔒 Aapki privacy important hai</p>

</main>

</body>
</html>
