<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Forgot Password | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/forgot-password.css"
    >

</head>


<body>

<div class="forgot-page">

    <main class="forgot-container">


        <!-- BRAND -->

        <div class="brand">

            <span class="brand-blue">Usa</span><span class="brand-white">nex</span>

        </div>


        <!-- =================================================
             STEP 1
        ================================================== -->

        <section
            id="stepIdentifier"
            class="step active"
        >

            <div class="page-heading">

                <div class="back-row">

                    <a
                        href="/login"
                        class="back-button"
                    >
                        ←
                    </a>

                </div>


                <h1>
                    Forgot <span>Password?</span>
                </h1>


                <p>
                    Enter your username or mobile number
                    to reset your Usanex password.
                </p>

            </div>


            <form
                id="sendOtpForm"
                class="forgot-form"
            >

                <div class="input-group">

                    <label for="identifier">
                        Username or Mobile
                    </label>


                    <div class="input-box">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <circle
                                    cx="12"
                                    cy="8"
                                    r="4"
                                ></circle>

                                <path
                                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                                ></path>

                            </svg>

                        </span>


                        <input
                            type="text"
                            id="identifier"
                            name="identifier"
                            placeholder="Username or mobile"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div
                    id="identifierMessage"
                    class="message"
                    hidden
                ></div>


                <button
                    type="submit"
                    id="sendOtpButton"
                    class="primary-button"
                >

                    <span>
                        Get OTP
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>

        </section>


        <!-- =================================================
             STEP 2
        ================================================== -->

        <section
            id="stepOtp"
            class="step"
            hidden
        >

            <div class="page-heading">

                <div class="back-row">

                    <button
                        type="button"
                        id="backToIdentifier"
                        class="back-button"
                    >
                        ←
                    </button>

                </div>


                <h1>
                    Verify <span>OTP</span>
                </h1>


                <p>
                    Enter the 6-digit OTP sent for your
                    account password reset.
                </p>

            </div>


            <form
                id="resetPasswordForm"
                class="forgot-form"
            >

                <!-- OTP -->

                <div class="input-group">

                    <label for="otp">
                        OTP
                    </label>


                    <div class="input-box otp-box">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M7 9h.01M11 9h.01M15 9h.01M7 13h.01M11 13h.01M15 13h.01"
                                ></path>

                            </svg>

                        </span>


                        <input
                            type="text"
                            id="otp"
                            name="otp"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            placeholder="Enter 6-digit OTP"
                            required
                        >

                    </div>

                </div>


                <!-- DEVELOPMENT OTP -->

                <div
                    id="developmentOtpCard"
                    class="development-otp"
                    hidden
                >

                    <div class="development-title">
                        Development OTP
                    </div>


                    <div
                        id="developmentOtp"
                        class="development-code"
                    >
                        ------
                    </div>


                    <div class="development-note">
                        This OTP is visible only during development.
                    </div>

                </div>


                <!-- TIMER -->

                <div class="otp-status">

                    <span>
                        OTP expires in
                    </span>

                    <strong id="otpTimer">
                        02:00
                    </strong>

                </div>


                <!-- NEW PASSWORD -->

                <div class="input-group">

                    <label for="newPassword">
                        New Password
                    </label>


                    <div class="input-box">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >

                                <rect
                                    x="
