<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#080f1d">

    <title>My Profile | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/my-profile.css?v=30"
    >
</head>

<body>

<div class="profile-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="profile-header">

        <!-- PLUS -->

        <button
            type="button"
            class="profile-add-button"
            id="profileAddButton"
            aria-label="Create"
        >
            +
        </button>


        <!-- NAME -->

        <h1
            class="profile-header-name"
            id="profileName"
        >
            Usanex User
        </h1>


        <!-- MENU -->

        <button
            type="button"
            class="profile-menu-button"
            id="profileMenuButton"
            aria-label="Open menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>


    <!-- =====================================================
         MAIN PROFILE
    ====================================================== -->

    <main class="profile-main">

        <!-- =================================================
             2ND ROW — PROFILE + USER INFORMATION
        ================================================== -->

        <section class="profile-user-row">

            <!-- PROFILE PHOTO -->

            <button
                type="button"
                class="profile-photo-button"
                id="profilePhotoButton"
                aria-label="View profile photo"
            >

                <img
                    id="profilePhoto"
                    class="profile-photo"
                    src="/static/images/default-profile.png"
                    alt="Profile photo"
                >

            </button>


            <!-- USER INFORMATION -->

            <div class="profile-user-info">

                <h2 id="profileDisplayName">
                    Usanex User
                </h2>

                <div
                    class="profile-username"
                    id="profileUsername"
                >
                    @username
                </div>

                <div
                    class="profile-user-id"
                    id="profileUserId"
                >
                    u_xxxxxxxx
                </div>

            </div>

        </section>


        <!-- =================================================
             3RD ROW — BIO
        ================================================== -->

        <section class="profile-bio-section">

            <p
                class="profile-bio"
                id="profileBio"
            >
                No bio available.
            </p>

            <div
                class="profile-links"
                id="profileLinks"
                hidden
            ></div>

        </section>


        <!-- =================================================
             4TH ROW — STATS
        ================================================== -->

        <section class="profile-stats">

            <div class="profile-stat">

                <strong id="followersCount">
                    0
                </strong>

                <span>
                    Followers
                </span>

            </div>


            <div class="profile-stat">

                <strong id="connectedCount">
                    0
                </strong>

                <span>
                    Connected
                </span>

            </div>


            <div class="profile-stat">

                <strong id="followingCount">
                    0
                </strong>

                <span>
                    Following
                </span>

            </div>


            <div class="profile-stat">

                <strong id="postsCount">
                    0
                </strong>

                <span>
                    Posts
                </span>

            </div>

        </section>


        <!-- =================================================
             5TH ROW — CONTENT TABS
        ================================================== -->

        <nav
            class="profile-content-tabs"
            aria-label="Profile content"
        >

            <button
                type="button"
                class="profile-content-tab active"
                data-tab="reels"
            >
                Reels
            </button>

            <button
                type="button"
                class="profile-content-tab"
                data-tab="photos"
            >
                Photos
            </button>

            <button
                type="button"
                class="profile-content-tab"
                data-tab="saved"
            >
                Saved
            </button>

            <button
                type="button"
                class="profile-content-tab"
                data-tab="private"
            >
                Private
            </button>

        </nav>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <section
            class="profile-content"
            id="profileContentContainer"
        >

            <div class="empty-content">
                No reels yet.
            </div>

        </section>

    </main>


    <!-- =====================================================
         PROFILE PHOTO VIEWER
    ====================================================== -->

    <div
        class="profile-photo-viewer hidden"
        id="profilePhotoViewer"
    >

        <button
            type="button"
            class="close-photo-viewer"
            id="closePhotoViewer"
            aria-label="Close"
        >
            ×
        </button>

        <img
            id="viewerPhoto"
            src=""
            alt="Profile photo"
        >

    </div>


    <!-- =====================================================
         EDIT PROFILE MODAL
    ====================================================== -->

    <div
        class="edit-profile-modal hidden"
        id="editProfileModal"
    >

        <div class="edit-profile-box">

            <div class="edit-profile-header">

                <h2>
                    Edit Profile
                </h2>

                <button
                    type="button"
                    id="closeEditProfile"
                >
                    ×
                </button>

            </div>


            <div class="edit-profile-photo-area">

                <img
                    id="editProfilePhotoPreview"
                    src="/static/images/default-profile.png"
                    alt="Profile photo"
                >

                <button
                    type="button"
                    id="changeProfilePhotoButton"
                >
                    Change Photo
                </button>

                <input
                    type="file"
                    id="profilePhotoInput"
                    accept="image/*"
                    hidden
                >

            </div>


            <label>
                Name

                <input
                    type="text"
                    id="editName"
                    maxlength="100"
                >
            </label>


            <label>
                Username

                <input
                    type="text"
                    id="editUsername"
                    disabled
                >
            </label>


            <label>
                User ID

                <input
                    type="text"
                    id="editUserId"
                    disabled
                >
            </label>


            <label>
                Bio

                <textarea
                    id="editBio"
                    maxlength="500"
                    rows="4"
                ></textarea>
            </label>


            <label>
                Website

                <input
                    type="url"
                    id="editWebsite"
                >
            </label>


            <label>
                Instagram

                <input
                    type="text"
                    id="editInstagram"
                >
            </label>


            <label>
                Social Link

                <input
                    type="url"
                    id="editSocialLink"
                >
            </label>


            <div
                class="edit-profile-message"
                id="editProfileMessage"
            ></div>


            <button
                type="button"
                class="save-profile-button"
                id="saveProfileButton"
            >
                Save Changes
            </button>

        </div>

    </div>


    <!-- =====================================================
         PROFILE MENU
    ====================================================== -->

    <div
        class="profile-menu hidden"
        id="profileMenu"
    >

        <div class="profile-menu-panel">

            <div class="profile-menu-title">
                Usanex
            </div>


            <button
                type="button"
                id="editProfileButton"
            >
                Edit Profile
            </button>


            <button
                type="button"
                id="privacyButton"
            >
                Privacy
            </button>


            <button
                type="button"
                id="securityButton"
            >
                Security
            </button>


            <button
                type="button"
                id="blockedUsersButton"
            >
                Blocked Users
            </button>


            <button
                type="button"
                id="accountButton"
            >
                Account
            </button>


            <button
                type="button"
                id="helpButton"
            >
                Help
            </button>


            <button
                type="button"
                id="aboutButton"
            >
                About Usanex
            </button>


            <div class="menu-divider"></div>


            <button
                type="button"
                class="logout-menu-button"
                id="logoutButton"
            >
                Logout
            </button>

        </div>

    </div>


    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav
        class="bottom-nav"
        aria-label="Main navigation"
    >

        <!-- HOME -->

        <button
            type="button"
            class="nav-item"
            id="navHome"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5.5 9.5V21h13V9.5"></path>
            </svg>

            <span>
                Home
            </span>

        </button>


        <!-- REELS -->

        <button
            type="button"
            class="nav-item"
            id="navReels"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <rect
                    x="3"
                    y="4"
                    width="18"
                    height="16"
                    rx="3"
                ></rect>

                <path d="M8 4l3 5"></path>
                <path d="M14 4l3 5"></path>
                <path d="M10 12l5 3-5 3v-6z"></path>
            </svg>

            <span>
                Reel
            </span>

        </button>


        <!-- SEARCH -->

        <button
            type="button"
            class="nav-item"
            id="navSearch"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <circle
                    cx="11"
                    cy="11"
                    r="7"
                ></circle>

                <path d="M20 20l-4-4"></path>
            </svg>

            <span>
                Search
            </span>

        </button>


        <!-- NOTIFICATION -->

        <button
            type="button"
            class="nav-item"
            id="navNotifications"
        >

            <span class="notification-icon-wrapper">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path d="M10 21h4"></path>
                </svg>

                <span
                    class="notification-dot"
                    hidden
                ></span>

            </span>

            <span>
                Notification
            </span>

        </button>


        <!-- PROFILE -->

        <button
            type="button"
            class="nav-item active"
            id="navProfile"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <circle
                    cx="12"
                    cy="8"
                    r="4"
                ></circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                ></path>
            </svg>

            <span>
                Profile
            </span>

        </button>

    </nav>

</div>


<script
    src="/static/js/my-profile.js?v=30"
    defer
></script>

</body>
</html>
