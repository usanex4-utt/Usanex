<!-- USANEX CREATE SHEET -->

<div id="createOverlay" class="create-overlay">

    <div id="createSheet" class="create-sheet">

        <div class="create-handle"></div>

        <div class="create-header">
            <div>
                <h2>Create</h2>
                <p>Share something on Usanex</p>
            </div>

            <button
                type="button"
                id="closeCreateSheet"
                class="create-close"
                aria-label="Close"
            >
                ×
            </button>
        </div>

        <div class="create-options">

            <!-- REEL -->
            <button
                type="button"
                class="create-option"
                data-create-type="reel"
            >
                <span class="create-line-icon reel-icon">
                    <span></span>
                </span>

                <span class="create-option-text">
                    <strong>Reel</strong>
                    <small>Create a video reel</small>
                </span>

                <span class="create-arrow">›</span>
            </button>


            <!-- IMAGE -->
            <button
                type="button"
                class="create-option"
                data-create-type="image"
            >
                <span class="create-line-icon image-icon">
                    <span></span>
                </span>

                <span class="create-option-text">
                    <strong>Image</strong>
                    <small>Share photos</small>
                </span>

                <span class="create-arrow">›</span>
            </button>


            <!-- NEX MOMENT -->
            <button
                type="button"
                class="create-option"
                data-create-type="moment"
            >
                <span class="create-line-icon moment-icon">
                    <span></span>
                </span>

                <span class="create-option-text">
                    <strong>Nex Moment</strong>
                    <small>Share your moment</small>
                </span>

                <span class="create-arrow">›</span>
            </button>


            <!-- PRIVATE -->
            <button
                type="button"
                class="create-option"
                data-create-type="private"
            >
                <span class="create-line-icon private-icon">
                    <span></span>
                </span>

                <span class="create-option-text">
                    <strong>Private</strong>
                    <small>Share privately</small>
                </span>

                <span class="create-arrow">›</span>
            </button>

        </div>

    </div>

</div>
