<!-- =========================================================
     USANEX — CREATE SHEET
     HOME SIZE / HALF SCREEN
     ========================================================= -->

<div
    id="createOverlay"
    class="create-overlay"
    hidden
    aria-hidden="true"
>

    <div
        id="createSheet"
        class="create-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="createTitle"
    >

        <!-- =================================================
             DRAG HANDLE
             ================================================= -->

        <div
            class="create-handle"
            aria-hidden="true"
        ></div>


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="create-header">

            <h2 id="createTitle">
                Create
            </h2>

            <button
                type="button"
                id="closeCreateSheet"
                class="create-close"
                aria-label="Close create menu"
            >
                ×
            </button>

        </header>


        <!-- =================================================
             CREATE OPTIONS
             ================================================= -->

        <div class="create-options">


            <!-- =================================================
                 REEL
                 ================================================= -->

            <button
                type="button"
                class="create-option"
                data-create-type="reel"
            >

                <span
                    class="create-line-icon reel-icon"
                    aria-hidden="true"
                >
                    <svg
                        viewBox="0 0 48 48"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <rect
                            x="7"
                            y="5"
                            width="34"
                            height="38"
                            rx="8"
                            stroke="currentColor"
                            stroke-width="3"
                        />

                        <path
                            d="M17 5L21 13"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <path
                            d="M27 5L31 13"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <path
                            d="M21 20L32 26L21 32V20Z"
                            fill="currentColor"
                        />

                    </svg>
                </span>


                <span class="create-option-text">
                    <strong>Reel</strong>
                    <small>Create a short video</small>
                </span>


                <span
                    class="create-arrow"
                    aria-hidden="true"
                >
                    ›
                </span>

            </button>



            <!-- =================================================
                 IMAGE
                 ================================================= -->

            <button
                type="button"
                class="create-option"
                data-create-type="image"
            >

                <span
                    class="create-line-icon image-icon"
                    aria-hidden="true"
                >
                    <svg
                        viewBox="0 0 48 48"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <rect
                            x="7"
                            y="7"
                            width="34"
                            height="34"
                            rx="6"
                            stroke="currentColor"
                            stroke-width="3"
                        />

                        <circle
                            cx="31"
                            cy="17"
                            r="3"
                            fill="currentColor"
                        />

                        <path
                            d="M11 35L21 25L27 31L31 27L37 35"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>
                </span>


                <span class="create-option-text">
                    <strong>Image</strong>
                    <small>Share photos with people</small>
                </span>


                <span
                    class="create-arrow"
                    aria-hidden="true"
                >
                    ›
                </span>

            </button>



            <!-- =================================================
                 PRIVATE
                 ================================================= -->

            <button
                type="button"
                class="create-option"
                data-create-type="private"
            >

                <span
                    class="create-line-icon private-icon"
                    aria-hidden="true"
                >
                    <svg
                        viewBox="0 0 48 48"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <rect
                            x="9"
                            y="20"
                            width="30"
                            height="22"
                            rx="5"
                            stroke="currentColor"
                            stroke-width="3"
                        />

                        <path
                            d="M15 20V15C15 10 19 6 24 6C29 6 33 10 33 15V20"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <circle
                            cx="24"
                            cy="31"
                            r="2"
                            fill="currentColor"
                        />

                    </svg>
                </span>


                <span class="create-option-text">
                    <strong>Private</strong>
                    <small>Share media privately</small>
                </span>


                <span
                    class="create-arrow"
                    aria-hidden="true"
                >
                    ›
                </span>

            </button>



            <!-- =================================================
                 NEX MOMENT
                 ================================================= -->

            <button
                type="button"
                class="create-option"
                data-create-type="moment"
            >

                <span
                    class="create-line-icon moment-icon"
                    aria-hidden="true"
                >
                    <svg
                        viewBox="0 0 48 48"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            d="M16 9C10 12 7 17 7 24C7 31 10 36 16 39"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <path
                            d="M32 9C38 12 41 17 41 24C41 31 38 36 32 39"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <path
                            d="M24 16V32"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <path
                            d="M16 24H32"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                    </svg>
                </span>


                <span class="create-option-text">
                    <strong>Nex Moment</strong>
                    <small>Share a moment with your connections</small>
                </span>


                <span
                    class="create-arrow"
                    aria-hidden="true"
                >
                    ›
                </span>

            </button>

        </div>

    </div>

</div>
