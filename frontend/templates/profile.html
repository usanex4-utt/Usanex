<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/profile.css?v=8"
    >
</head>

<body>

<main class="profile-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="profile-header">

        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Go back"
        >
            ←
        </button>

        <div
            id="profileHeaderTitle"
            class="profile-header-title"
        >
            Loading...
        </div>

        <div class="profile-menu-wrapper">

            <button
                id="profileMenuButton"
                class="profile-menu-button"
                type="button"
                aria-label="Profile menu"
            >
                ⋮
            </button>

            <div
                id="profileMenu"
                class="profile-menu hidden"
            >

                <button
                    id="blockButton"
                    class="profile-menu-item"
                    type="button"
                >
                    Block
                </button>

                <button
                    id="shareButton"
                    class="profile-menu-item"
                    type="button"
                >
                    Share
                </button>

                <button
                    id="qrButton"
                    class="profile-menu-item"
                    type="button"
                >
                    QR Code
                </button>

                <button
                    id="reportButton"
                    class="profile-menu-item"
                    type="button"
                >
                    Report
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <section
        id="profileError"
        class="profile-error hidden"
    >
        <div class="profile-error-title">
            Unable to open profile
        </div>

        <div
            id="profileErrorMessage"
            class="profile-error-message"
        >
            Please try again.
        </div>

        <button
            id="profileErrorBack"
            class="profile-error-button"
            type="button"
        >
            Go Back
        </button>
    </section>


    <!-- =====================================================
         PROFILE CONTENT
    ====================================================== -->

    <section
        id="profileContent"
        class="profile-content"
    >

        <!-- =================================================
             PROFILE TOP
        ================================================== -->

        <section class="profile-top">

            <!-- Profile photo -->

            <div class="profile-photo-wrapper">

                <img
                    id="profilePhoto"
                    class="profile-photo"
                    src="/static/images/default-profile.png"
                    alt="Profile photo"
                >

            </div>


            <!-- User information -->

            <div class="profile-user-info">

                <div
                    id="profileUsername"
                    class="profile-username"
                >
                    @username
                </div>

                <div
                    id="profileUserId"
                    class="profile-user-id"
                >
                    user_id
                </div>

            </div>

        </section>


        <!-- =================================================
             STATS
        ================================================== -->

        <section class="profile-stats">

            <div class="profile-stat">

                <div
                    id="followersCount"
                    class="profile-stat-number"
                >
                    0
                </div>

                <div class="profile-stat-label">
                    Followers
                </div>

            </div>


            <div class="profile-stat">

                <div
                    id="connectedCount"
                    class="profile-stat-number"
                >
                    0
                </div>

                <div class="profile-stat-label">
                    Connected
                </div>

            </div>


            <div class="profile-stat">

                <div
                    id="followingCount"
                    class="profile-stat-number"
                >
                    0
                </div>

                <div class="profile-stat-label">
                    Following
                </div>

            </div>


            <div class="profile-stat">

                <div
                    id="postsCount"
                    class="profile-stat-number"
                >
                    0
                </div>

                <div class="profile-stat-label">
                    Posts
                </div>

            </div>

        </section>


        <!-- =================================================
             BIO
        ================================================== -->

        <section class="bio-section">

            <h2 class="section-title">
                Bio
            </h2>

            <p
                id="profileBio"
                class="profile-bio"
            >
                No bio available.
            </p>

        </section>


        <!-- =================================================
             CONTENT TABS
        ================================================== -->

        <section class="profile-content-section">

            <div class="profile-tabs">

                <button
                    id="reelsTab"
                    class="profile-tab active"
                    type="button"
                    data-tab="reels"
                >
                    Reels
                </button>

                <button
                    id="photosTab"
                    class="profile-tab"
                    type="button"
                    data-tab="photos"
                >
                    Photos
                </button>

            </div>


            <!-- =============================================
                 CONTENT GRID
            ============================================== -->

            <div
                id="postsContainer"
                class="posts-container"
            >

                <div class="empty-posts">
                    No reels yet.
                </div>

            </div>

        </section>

    </section>

</main>


<script
    src="/static/js/profile.js?v=8"
    defer
></script>

</body>
</html>
