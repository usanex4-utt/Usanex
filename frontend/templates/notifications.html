<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Notifications - Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/notifications.css?v=10"
    >
</head>

<body>

<div class="notifications-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="notifications-header">

        <h1 class="header-title">
            Notifications
        </h1>

        <div class="header-right">

            <button
                type="button"
                class="delete-notifications"
                id="deleteNotifications"
                aria-label="Clear notifications"
                title="Clear notifications"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                >
                    <path d="M4 7h16"></path>
                    <path d="M9 7V4h6v3"></path>
                    <path d="M7 7l1 13h8l1-13"></path>
                    <path d="M10 11v5"></path>
                    <path d="M14 11v5"></path>
                </svg>

            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="notifications-main">

        <!-- LOADING -->

        <div
            id="notificationLoading"
            class="notification-loading"
            role="status"
            aria-live="polite"
        >
            Loading notifications...
        </div>


        <!-- EMPTY STATE -->

        <div
            id="notificationEmpty"
            class="notification-empty"
            hidden
        >

            <div class="empty-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    aria-hidden="true"
                >

                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path d="M10 21h4"></path>

                </svg>

            </div>

            <h2>
                No notifications
            </h2>

            <p>
                New connection requests and updates will appear here.
            </p>

        </div>


        <!-- CONNECTION REQUESTS -->

        <section
            id="connectionRequestsSection"
            class="notification-section"
            hidden
        >

            <div class="section-title-row">

                <h2>
                    Connection Requests
                </h2>

            </div>

            <div
                id="connectionRequests"
                class="connection-requests"
                aria-live="polite"
            ></div>

        </section>


        <!-- OTHER NOTIFICATIONS -->

        <section
            id="otherNotificationsSection"
            class="notification-section"
            hidden
        >

            <div class="section-title-row">

                <h2>
                    Other
                </h2>

            </div>

            <div
                id="otherNotifications"
                class="other-notifications"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         STATUS POPUP
    ====================================================== -->

    <div
        id="notificationPopup"
        class="status-popup"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    ></div>


    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav
        class="bottom-nav"
        aria-label="Main navigation"
    >

        <!-- HOME -->

        <button
            type="button"
            class="nav-item"
            id="homeNav"
            aria-label="Home"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >

                <path d="M3 10.5L12 3l9 7.5"></path>

                <path d="M5.5 9.5V21h13V9.5"></path>

            </svg>

            <span>
                Home
            </span>

        </button>


        <!-- REEL -->

        <button
            type="button"
            class="nav-item"
            id="reelNav"
            aria-label="Reel"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >

                <rect
                    x="3"
                    y="4"
                    width="18"
                    height="16"
                    rx="3"
                ></rect>

                <path d="M8 4l3 5"></path>

                <path d="M14 4l3 5"></path>

                <path d="M10 12l5 3-5 3v-6z"></path>

            </svg>

            <span>
                Reel
            </span>

        </button>


        <!-- SEARCH -->

        <button
            type="button"
            class="nav-item"
            id="searchNav"
            aria-label="Search"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >

                <circle
                    cx="11"
                    cy="11"
                    r="7"
                ></circle>

                <path d="M20 20l-4-4"></path>

            </svg>

            <span>
                Search
            </span>

        </button>


        <!-- NOTIFICATION - ACTIVE -->

        <button
            type="button"
            class="nav-item active"
            id="notificationNav"
            aria-label="Notification"
            aria-current="page"
        >

            <span class="notification-icon-wrapper">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                >

                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path d="M10 21h4"></path>

                </svg>

                <span
                    class="notification-dot"
                    id="notificationDot"
                    hidden
                    aria-hidden="true"
                ></span>

            </span>

            <span>
                Notification
            </span>

        </button>


        <!-- PROFILE -->

        <button
            type="button"
            class="nav-item"
            id="profileNav"
            aria-label="Profile"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >

                <circle
                    cx="12"
                    cy="8"
                    r="4"
                ></circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                ></path>

            </svg>

            <span>
                Profile
            </span>

        </button>

    </nav>

</div>


<!-- =========================================================
     EXISTING NOTIFICATION JAVASCRIPT
========================================================== -->

<script
    src="/static/js/notifications.js?v=10"
    defer
></script>


<!-- =========================================================
     BOTTOM NAVIGATION
========================================================== -->

<script>

document.addEventListener("DOMContentLoaded", () => {

    /*
    =========================================================
       HOME
    =========================================================
    */

    const homeNav =
        document.getElementById("homeNav");

    if (homeNav) {

        homeNav.addEventListener("click", () => {

            window.location.href = "/home";

        });

    }


    /*
    =========================================================
       REEL
    =========================================================
    */

    const reelNav =
        document.getElementById("reelNav");

    if (reelNav) {

        reelNav.addEventListener("click", () => {

            window.location.href = "/reels";

        });

    }


    /*
    =========================================================
       SEARCH
    =========================================================
    */

    const searchNav =
        document.getElementById("searchNav");

    if (searchNav) {

        searchNav.addEventListener("click", () => {

            window.location.href = "/search";

        });

    }


    /*
    =========================================================
       NOTIFICATION
    =========================================================
    */

    const notificationNav =
        document.getElementById("notificationNav");

    if (notificationNav) {

        notificationNav.addEventListener("click", () => {

            window.location.href = "/notifications";

        });

    }


    /*
    =========================================================
       PROFILE
       ALWAYS OPENS MY PROFILE
    =========================================================
    */

    const profileNav =
        document.getElementById("profileNav");

    if (profileNav) {

        profileNav.addEventListener("click", () => {

            window.location.href = "/my-profile";

        });

    }

});

</script>

</body>

</html>
