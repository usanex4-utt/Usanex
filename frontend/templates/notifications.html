<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Notifications - Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/notifications.css?v=5"
    >
</head>

<body>

<div class="notifications-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="notifications-header">

        <h1 class="header-title">
            Notifications
        </h1>


        <div class="header-right">

            <button
                type="button"
                class="delete-notifications"
                id="deleteNotifications"
                aria-label="Delete notifications"
                title="Delete notifications"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                >

                    <path d="M4 7h16"></path>

                    <path d="M9 7V4h6v3"></path>

                    <path d="M7 7l1 13h8l1-13"></path>

                    <path d="M10 11v5"></path>

                    <path d="M14 11v5"></path>

                </svg>

            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="notifications-main">

        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="notificationLoading"
            class="notification-loading"
        >
            Loading notifications...
        </div>


        <!-- =================================================
             EMPTY STATE
        ================================================== -->

        <div
            id="notificationEmpty"
            class="notification-empty"
            hidden
        >

            <div class="empty-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    aria-hidden="true"
                >

                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path
                        d="M10 21h4"
                    ></path>

                </svg>

            </div>


            <h2>
                No notifications
            </h2>


            <p>
                New connection requests will appear here.
            </p>

        </div>


        <!-- =================================================
             CONNECTION REQUESTS
        ================================================== -->

        <section
            id="connectionRequestsSection"
            class="notification-section"
            hidden
        >

            <div class="section-title-row">

                <h2>
                    Connection Requests
                </h2>

            </div>


            <div
                id="connectionRequests"
                class="connection-requests"
            ></div>

        </section>


        <!-- =================================================
             OTHER NOTIFICATIONS
        ================================================== -->

        <section
            id="otherNotificationsSection"
            class="notification-section"
            hidden
        >

            <div class="section-title-row">

                <h2>
                    Other
                </h2>

            </div>


            <div
                id="otherNotifications"
                class="other-notifications"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         TOP NOTIFICATION POPUP
    ====================================================== -->

    <div
        id="notificationPopup"
        class="status-popup"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    ></div>


    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="bottom-nav">

        <!-- HOME -->

        <button
            type="button"
            class="nav-item"
            id="homeNav"
            aria-label="Home"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >

                <path d="M3 10.5L12 3l9 7.5"></path>

                <path d="M5.5 9.5V21h13V9.5"></path>

            </svg>

            <span>
                Home
            </span>

        </button>


        <!-- REEL -->

        <button
            type="button"
            class="nav-item"
            id="reelNav"
            aria-label="Reel"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >

                <rect
                    x="3"
                    y="4"
                    width="18"
                    height="16"
                    rx="3"
                ></rect>

                <path d="M8 4l3 5"></path>

                <path d="M14 4l3 5"></path>

                <path d="M10 12l5 3-5 3v-6z"></path>

            </svg>

            <span>
                Reel
            </span>

        </button>


        <!-- SEARCH -->

        <button
            type="button"
            class="nav-item"
            id="searchNav"
            aria-label="Search"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >

                <circle
                    cx="11"
                    cy="11"
                    r="7"
                ></circle>

                <path
                    d="M20 20l-4-4"
                ></path>

            </svg>

            <span>
                Search
            </span>

        </button>


        <!-- NOTIFICATION -->

        <button
            type="button"
            class="nav-item active"
            id="notificationNav"
            aria-label="Notification"
        >

            <span class="notification-icon-wrapper">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                >

                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path
                        d="M10 21h4"
                    ></path>

                </svg>

                <span
                    class="notification-dot"
                    id="notificationDot"
                    hidden
                ></span>

            </span>

            <span>
                Notification
            </span>

        </button>


        <!-- PROFILE -->

        <button
            type="button"
            class="nav-item"
            id="profileNav"
            aria-label="Profile"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >

                <circle
                    cx="12"
                    cy="8"
                    r="4"
                ></circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                ></path>

            </svg>

            <span>
                Profile
            </span>

        </button>

    </nav>

</div>


<script src="/static/js/notifications.js?v=5"></script>

</body>

</html>
