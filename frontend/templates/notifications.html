<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications - Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/notifications.css?v=2"
    >
</head>

<body>

<div class="notifications-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="notifications-header">

        <div class="header-left">

            <button
                type="button"
                class="back-button"
                id="backButton"
                aria-label="Go back"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                >
                    <path d="M19 12H5"></path>

                    <path
                        d="M12 19l-7-7 7-7"
                    ></path>
                </svg>

            </button>

        </div>


        <h1 class="header-title">
            Notifications
        </h1>


        <div class="header-right"></div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="notifications-main">

        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="notificationLoading"
            class="notification-loading"
        >
            Loading notifications...
        </div>


        <!-- =================================================
             EMPTY STATE
        ================================================== -->

        <div
            id="notificationEmpty"
            class="notification-empty"
            hidden
        >

            <div class="empty-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    aria-hidden="true"
                >

                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path
                        d="M10 21h4"
                    ></path>

                </svg>

            </div>


            <h2>
                No notifications
            </h2>


            <p>
                New connection requests will appear here.
            </p>

        </div>


        <!-- =================================================
             CONNECTION REQUESTS
        ================================================== -->

        <section
            id="connectionRequestsSection"
            class="notification-section"
            hidden
        >

            <div class="section-title-row">

                <h2>
                    Connection Requests
                </h2>

            </div>


            <div
                id="connectionRequests"
                class="connection-requests"
            ></div>

        </section>


        <!-- =================================================
             OTHER NOTIFICATIONS
        ================================================== -->

        <section
            id="otherNotificationsSection"
            class="notification-section"
            hidden
        >

            <div class="section-title-row">

                <h2>
                    Other
                </h2>

            </div>


            <div
                id="otherNotifications"
                class="other-notifications"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         TOP NOTIFICATION POPUP
    ====================================================== -->

    <div
        id="notificationPopup"
        class="status-popup"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    ></div>

</div>


<script src="/static/js/notifications.js?v=2"></script>

</body>

</html>
