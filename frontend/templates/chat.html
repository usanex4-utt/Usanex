<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#071322"
    >

    <title>Chat | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/chat.css?v=3"
    >
</head>

<body>

<div class="chat-app">

    <!-- =====================================================
         CHAT HEADER
    ====================================================== -->

    <header class="conversation-header">

        <!-- BACK -->

        <button
            type="button"
            class="back-button"
            id="backButton"
            aria-label="Back"
        >
            ‹
        </button>


        <!-- USER DP -->

        <button
            type="button"
            class="selected-avatar-wrap"
            id="selectedAvatarButton"
            aria-label="Open profile"
        >

            <img
                id="selectedAvatar"
                src="/static/images/default-profile.png"
                alt="Profile"
            >

            <span
                class="online-dot"
                id="headerOnlineDot"
                hidden
            ></span>

        </button>


        <!-- USER INFORMATION -->

        <div class="selected-info">

            <strong id="selectedName">
                Loading...
            </strong>

            <span id="selectedStatus">
                Offline
            </span>

        </div>


        <!-- HEADER ACTIONS -->

        <div class="conversation-actions">

            <!-- CALL -->

            <button
                type="button"
                id="voiceCallButton"
                aria-label="Voice call"
            >
                ☎
            </button>


            <!-- MENU -->

            <button
                type="button"
                id="conversationMenu"
                aria-label="More options"
            >
                ⋮
            </button>

        </div>

    </header>


    <!-- =====================================================
         CHAT BODY
    ====================================================== -->

    <main
        class="conversation"
        id="conversation"
    >

        <!-- WATERMARK -->

        <div
            class="watermark"
            aria-hidden="true"
        >
            Usanex
        </div>


        <!-- MESSAGES -->

        <section
            class="messages"
            id="messages"
            aria-live="polite"
        >

            <div class="day-label">
                Today
            </div>

        </section>

    </main>


    <!-- =====================================================
         TYPING / MESSAGE COMPOSER
    ====================================================== -->

    <div class="chat-bottom">

        <!-- TYPING INDICATOR -->

        <div
            class="typing-indicator"
            id="typingIndicator"
            hidden
        >
            typing...
        </div>


        <!-- COMPOSER -->

        <form
            class="composer"
            id="composer"
        >

            <!-- EMOJI -->

            <button
                type="button"
                id="emojiButton"
                aria-label="Emoji"
            >
                😊
            </button>


            <!-- MESSAGE -->

            <input
                type="text"
                id="messageInput"
                placeholder="Message"
                maxlength="4000"
                autocomplete="off"
            >


            <!-- ATTACHMENT -->

            <button
                type="button"
                id="attachButton"
                aria-label="Attach file"
            >
                📎
            </button>


            <!-- CAMERA -->

            <button
                type="button"
                id="cameraButton"
                aria-label="Camera"
            >
                📷
            </button>


            <!-- SEND -->

            <button
                type="submit"
                class="send-button"
                id="sendButton"
                aria-label="Send"
            >
                ➤
            </button>

        </form>

    </div>

</div>


<!-- =====================================================
     FILE INPUT
====================================================== -->

<input
    type="file"
    id="fileInput"
    hidden
    multiple
>


<!-- =====================================================
     CHAT JAVASCRIPT
====================================================== -->

<script
    src="/static/js/chat.js?v=4"
    defer
></script>

</body>

</html>
