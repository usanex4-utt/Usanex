
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#071322"
    >

    <title>Chat | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/chat.css?v=1"
    >

</head>


<body>

<div class="chat-app">


    <!-- =====================================================
         CHAT SIDEBAR
    ====================================================== -->

    <aside
        class="chat-sidebar"
        id="chatSidebar"
    >


        <!-- HEADER -->

        <header class="sidebar-header">

            <div class="brand">

                <span>
                    Usanex
                </span>

                <small>
                    AI
                </small>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    id="searchToggle"
                    aria-label="Search"
                >
                    ⌕
                </button>


                <button
                    type="button"
                    id="menuButton"
                    aria-label="Menu"
                >
                    ⋮
                </button>

            </div>

        </header>


        <!-- SEARCH -->

        <div class="chat-search">

            <span>
                ⌕
            </span>

            <input
                type="search"
                id="chatSearch"
                placeholder="Search chats..."
                autocomplete="off"
            >

        </div>


        <!-- FILTERS -->

        <div class="chat-filters">

            <button
                type="button"
                class="filter active"
                data-filter="all"
            >
                All
            </button>


            <button
                type="button"
                class="filter"
                data-filter="unread"
            >
                Unread
            </button>


            <button
                type="button"
                class="filter"
                data-filter="contacts"
            >
                Contacts
            </button>


            <button
                type="button"
                class="filter"
                data-filter="groups"
            >
                Groups
            </button>

        </div>


        <!-- CHAT LIST -->

        <div
            class="chat-list"
            id="chatList"
        >

            <!-- Chats will be loaded by chat.js -->

        </div>


        <!-- =================================================
             BOTTOM NAVIGATION
        ================================================== -->

        <nav
            class="bottom-nav"
            aria-label="Main navigation"
        >


            <!-- HOME -->

            <button
                type="button"
                data-page="/home"
            >

                <span>
                    ⌂
                </span>

                <small>
                    Home
                </small>

            </button>


            <!-- CHAT -->

            <button
                type="button"
                class="active"
                data-page="/chat"
            >

                <span>
                    ▣
                </span>

                <small>
                    Chat
                </small>

            </button>


            <!-- SEARCH -->

            <button
                type="button"
                data-page="/search"
            >

                <span>
                    ⌕
                </span>

                <small>
                    Search
                </small>

            </button>


            <!-- NOTIFICATION -->

            <button
                type="button"
                data-page="/notifications"
            >

                <span>
                    ♧
                </span>

                <small>
                    Notifications
                </small>

                <b>
                    3
                </b>

            </button>


            <!-- PROFILE -->

            <button
                type="button"
                data-page="/my-profile"
            >

                <span>
                    ♙
                </span>

                <small>
                    Profile
                </small>

            </button>

        </nav>

    </aside>



    <!-- =====================================================
         CONVERSATION
    ====================================================== -->

    <main
        class="conversation"
        id="conversation"
    >


        <!-- =================================================
             CHAT HEADER
        ================================================== -->

        <header class="conversation-header">


            <!-- MOBILE BACK -->

            <button
                type="button"
                class="back-button"
                id="backButton"
                aria-label="Back"
            >
                ‹
            </button>


            <!-- PROFILE PHOTO -->

            <div class="selected-avatar-wrap">

                <img
                    id="selectedAvatar"
                    src="/static/images/default-profile.png"
                    alt="Profile"
                >

                <i></i>

            </div>


            <!-- USER INFO -->

            <div class="selected-info">

                <strong
                    id="selectedName"
                >
                    Aarav Sharma
                </strong>


                <span
                    id="selectedStatus"
                >
                    Online
                </span>

            </div>


            <!-- CHAT ACTIONS -->

            <div class="conversation-actions">

                <button
                    type="button"
                    aria-label="Video call"
                >
                    ▣
                </button>


                <button
                    type="button"
                    aria-label="Voice call"
                >
                    ⌕
                </button>


                <button
                    type="button"
                    id="conversationMenu"
                    aria-label="More"
                >
                    ⋮
                </button>

            </div>

        </header>



        <!-- =================================================
             LIGHT USANEX AI WATERMARK
        ================================================== -->

        <div
            class="watermark"
            aria-hidden="true"
        >
            Usanex AI
        </div>



        <!-- =================================================
             MESSAGES
        ================================================== -->

        <section
            class="messages"
            id="messages"
        >

            <div class="day-label">
                Today
            </div>

        </section>



        <!-- =================================================
             MESSAGE COMPOSER
        ================================================== -->

        <form
            class="composer"
            id="composer"
        >


            <!-- EMOJI -->

            <button
                type="button"
                id="emojiButton"
                aria-label="Emoji"
            >
                ☺
            </button>


            <!-- MESSAGE INPUT -->

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                maxlength="4000"
                autocomplete="off"
            >


            <!-- ATTACHMENT -->

            <button
                type="button"
                id="attachButton"
                aria-label="Attach"
            >
                ⌕
            </button>


            <!-- CAMERA -->

            <button
                type="button"
                id="cameraButton"
                aria-label="Camera"
            >
                ▣
            </button>


            <!-- SEND -->

            <button
                type="submit"
                class="send-button"
                id="sendButton"
                aria-label="Send message"
            >
                ➤
            </button>

        </form>

    </main>

</div>



<!-- =========================================================
     FILE INPUT
========================================================== -->

<input
    type="file"
    id="fileInput"
    hidden
    multiple
>



<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script
    src="/static/js/chat.js?v=1"
    defer
></script>


</body>

</html>
