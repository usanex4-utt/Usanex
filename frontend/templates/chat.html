<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#071322">

    <title>Chat | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/chat.css?v=10"
    >
</head>

<body>

<div class="chat-page">

    <!-- =====================================================
         CHAT HEADER
    ====================================================== -->

    <header class="chat-header">

        <button
            type="button"
            class="chat-back-button"
            id="backButton"
            aria-label="Back"
        >
            ←
        </button>


        <button
            type="button"
            class="chat-user-button"
            id="chatUserButton"
        >

            <div class="chat-avatar-wrapper">

                <img
                    id="selectedAvatar"
                    src="/static/images/default-profile.png"
                    alt="Profile"
                >

                <span
                    class="online-dot"
                    id="onlineDot"
                ></span>

            </div>


            <div class="chat-user-info">

                <strong id="selectedName">
                    User
                </strong>

                <span id="selectedStatus">
                    Online
                </span>

            </div>

        </button>


        <div class="chat-header-actions">

            <button
                type="button"
                id="voiceCallButton"
                aria-label="Voice call"
            >
                ☎
            </button>


            <button
                type="button"
                id="videoCallButton"
                aria-label="Video call"
            >
                ▣
            </button>


            <button
                type="button"
                id="conversationMenu"
                aria-label="More"
            >
                ⋮
            </button>

        </div>

    </header>


    <!-- =====================================================
         LIGHT USANEX AI WATERMARK
    ====================================================== -->

    <div
        class="usanex-watermark"
        aria-hidden="true"
    >
        Usanex AI
    </div>


    <!-- =====================================================
         MESSAGES
    ====================================================== -->

    <main
        class="messages"
        id="messages"
    >

        <div class="today-label">
            Today
        </div>

        <!-- Messages are inserted by chat.js -->

    </main>


    <!-- =====================================================
         TYPING INDICATOR
    ====================================================== -->

    <div
        class="typing-indicator hidden"
        id="typingIndicator"
    >

        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- =====================================================
         MESSAGE COMPOSER
    ====================================================== -->

    <form
        class="message-composer"
        id="composer"
    >

        <!-- Emoji -->

        <button
            type="button"
            class="composer-button"
            id="emojiButton"
            aria-label="Emoji"
        >
            😊
        </button>


        <!-- Input -->

        <input
            type="text"
            id="messageInput"
            placeholder="Message"
            maxlength="4000"
            autocomplete="off"
        >


        <!-- Attachment -->

        <button
            type="button"
            class="composer-button"
            id="attachButton"
            aria-label="Attach file"
        >
            📎
        </button>


        <!-- Camera -->

        <button
            type="button"
            class="composer-button"
            id="cameraButton"
            aria-label="Camera"
        >
            📷
        </button>


        <!-- Send -->

        <button
            type="submit"
            class="send-button"
            id="sendButton"
            aria-label="Send"
        >
            ➤
        </button>

    </form>

</div>


<!-- =========================================================
     FILE INPUT
========================================================== -->

<input
    type="file"
    id="fileInput"
    hidden
    multiple
>


<!-- =========================================================
     CAMERA INPUT
========================================================== -->

<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    hidden
>


<!-- =========================================================
     MESSAGE MENU
========================================================== -->

<div
    class="chat-menu hidden"
    id="chatMenu"
>

    <button
        type="button"
        id="searchMessagesButton"
    >
        Search messages
    </button>

    <button
        type="button"
        id="clearChatButton"
    >
        Clear chat
    </button>

    <button
        type="button"
        id="muteChatButton"
    >
        Mute notifications
    </button>

    <button
        type="button"
        id="blockUserButton"
    >
        Block user
    </button>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script
    src="/static/js/chat.js?v=10"
    defer
></script>

</body>

</html>
