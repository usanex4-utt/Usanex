<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#07152f">

    <title>Couple Chat | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/couple-chat.css?v=10"
    >
</head>

<body data-couple-mode="calm">

<div class="couple-app" id="coupleApp">

    <!-- =====================================================
         HEADER
    ====================================================== -->
    <header class="couple-header">

        <button
            type="button"
            class="couple-back-button"
            id="coupleBackButton"
            aria-label="Back"
        >
            ‹
        </button>

        <button
            type="button"
            class="couple-avatar-button"
            id="coupleAvatarButton"
            aria-label="Open partner profile"
        >
            <img
                id="couplePartnerAvatar"
                src="/static/images/default-profile.png"
                alt="Partner"
            >

            <span
                class="couple-online-dot"
                id="coupleOnlineDot"
                hidden
            ></span>
        </button>

        <div class="couple-header-info">

            <strong id="couplePartnerName">
                Partner
            </strong>

            <span id="couplePartnerStatus">
                Offline
            </span>

        </div>

        <!-- ONLY MOOD TEXT -->
        <button
            type="button"
            class="couple-header-mood"
            id="coupleHeaderMood"
        >
            Mood
        </button>

        <button
            type="button"
            class="couple-menu-button"
            id="coupleMenuButton"
            aria-label="More options"
        >
            ⋮
        </button>

    </header>


    <!-- =====================================================
         AI MINI BAR
    ====================================================== -->
    <section
        class="couple-ai-mini"
        id="coupleAiPanel"
    >

        <div class="couple-ai-mini-icon">
            ✨
        </div>

        <div class="couple-ai-mini-content">

            <strong>
                Usanex Couple AI
            </strong>

            <span id="coupleAiStatus">
                Understanding your conversation...
            </span>

        </div>

        <button
            type="button"
            id="coupleAiButton"
            class="couple-ai-mini-button"
            aria-label="Open Couple AI"
        >
            ✨
        </button>

    </section>


    <!-- =====================================================
         CONNECTION INFO
    ====================================================== -->
    <section
        class="couple-connection-strip"
        id="coupleInfoCard"
    >

        <div class="couple-connection-item">

            <span class="connection-icon">
                ❤️
            </span>

            <div>
                <small>
                    Together
                </small>

                <strong id="coupleTogetherDays">
                    Just started
                </strong>
            </div>

        </div>


        <div class="connection-divider"></div>


        <div class="couple-connection-item">

            <span class="connection-icon">
                💕
            </span>

            <div>
                <small>
                    Connection
                </small>

                <strong id="coupleConnectionStatus">
                    Growing
                </strong>
            </div>

        </div>

    </section>


    <!-- =====================================================
         QUICK ACTIONS
    ====================================================== -->
    <section
        class="couple-quick-actions"
        id="coupleQuickActions"
    >

        <button
            type="button"
            class="couple-action"
            data-action="love"
        >
            <span>❤️</span>
            <small>Love</small>
        </button>


        <button
            type="button"
            class="couple-action"
            data-action="memory"
        >
            <span>📸</span>
            <small>Memory</small>
        </button>


        <button
            type="button"
            class="couple-action"
            data-action="question"
        >
            <span>💭</span>
            <small>Question</small>
        </button>


        <button
            type="button"
            class="couple-action"
            data-action="game"
        >
            <span>🎮</span>
            <small>Game</small>
        </button>

    </section>


    <!-- =====================================================
         CHAT AREA
    ====================================================== -->
    <main
        class="couple-conversation"
        id="coupleConversation"
    >

        <div
            class="couple-background-layer"
            id="coupleBackgroundLayer"
            aria-hidden="true"
        ></div>


        <div
            class="couple-effects-layer"
            id="coupleEffectsLayer"
            aria-hidden="true"
        ></div>


        <div
            class="couple-day-label"
            id="coupleDayLabel"
        >
            Today
        </div>


        <!-- TYPING -->
        <div
            class="couple-typing"
            id="coupleTyping"
            hidden
        >

            <span id="coupleTypingName">
                Partner
            </span>

            <span class="typing-dots">
                <i></i>
                <i></i>
                <i></i>
            </span>

            <span>
                typing...
            </span>

        </div>


        <!-- MESSAGES -->
        <section
            class="couple-messages"
            id="coupleMessages"
            aria-live="polite"
        >
        </section>


        <!-- AI SUGGESTIONS -->
        <section
            class="couple-suggestions"
            id="coupleSuggestions"
            hidden
        >

            <div class="couple-suggestions-title">
                AI Suggestions
            </div>

            <div
                class="couple-suggestion-list"
                id="coupleSuggestionList"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         MOOD OVERLAY
    ====================================================== -->
    <div
        class="couple-overlay hidden"
        id="coupleMoodOverlay"
    >

        <section class="couple-mood-panel">

            <div class="couple-panel-header">

                <div>

                    <small>
                        Couple Mood
                    </small>

                    <h2>
                        Choose your mood
                    </h2>

                </div>

                <button
                    type="button"
                    id="closeMoodPanel"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <div
                class="couple-mood-grid"
                id="coupleMoodGrid"
            >

                <button data-mode="romantic">
                    ❤️
                    <span>Romantic</span>
                </button>

                <button data-mode="deep_love">
                    💗
                    <span>Deep Love</span>
                </button>

                <button data-mode="happy">
                    😊
                    <span>Happy</span>
                </button>

                <button data-mode="funny">
                    😂
                    <span>Funny</span>
                </button>

                <button data-mode="sad">
                    😢
                    <span>Sad</span>
                </button>

                <button data-mode="emotional">
                    🥹
                    <span>Emotional</span>
                </button>

                <button data-mode="angry">
                    😡
                    <span>Angry</span>
                </button>

                <button data-mode="frustrated">
                    😤
                    <span>Frustrated</span>
                </button>

                <button data-mode="caring">
                    🫶
                    <span>Caring</span>
                </button>

                <button data-mode="comfort">
                    🤗
                    <span>Comfort</span>
                </button>

                <button data-mode="flirty">
                    😏
                    <span>Flirty</span>
                </button>

                <button data-mode="passionate">
                    🔥
                    <span>Passionate</span>
                </button>

                <button data-mode="good_night">
                    🌙
                    <span>Good Night</span>
                </button>

                <button data-mode="good_morning">
                    🌅
                    <span>Good Morning</span>
                </button>

                <button data-mode="memory">
                    📸
                    <span>Memory</span>
                </button>

                <button data-mode="celebration">
                    🎉
                    <span>Celebration</span>
                </button>

                <button data-mode="birthday">
                    🎂
                    <span>Birthday</span>
                </button>

                <button data-mode="future_marriage">
                    💍
                    <span>Future</span>
                </button>

                <button data-mode="missing_you">
                    🥺
                    <span>Missing You</span>
                </button>

                <button data-mode="apology">
                    🙏
                    <span>Apology</span>
                </button>

                <button data-mode="appreciation">
                    🥰
                    <span>Appreciation</span>
                </button>

                <button data-mode="game">
                    🎮
                    <span>Game</span>
                </button>

                <button data-mode="photo_memory">
                    🖼️
                    <span>Photo Memory</span>
                </button>

                <button data-mode="serious_talk">
                    🗣️
                    <span>Serious Talk</span>
                </button>

                <button data-mode="deep_conversation">
                    💭
                    <span>Deep Talk</span>
                </button>

                <button data-mode="calm">
                    😌
                    <span>Calm</span>
                </button>

            </div>

        </section>

    </div>


    <!-- =====================================================
         AI OVERLAY
    ====================================================== -->
    <div
        class="couple-overlay hidden"
        id="coupleAiOverlay"
    >

        <section class="couple-ai-modal">

            <div class="couple-panel-header">

                <div>

                    <small>
                        Usanex
                    </small>

                    <h2>
                        Couple AI ✨
                    </h2>

                </div>

                <button
                    type="button"
                    id="closeAiPanel"
                >
                    ×
                </button>

            </div>


            <div class="ai-modal-content">

                <button
                    type="button"
                    class="ai-modal-action"
                    data-ai-action="suggest"
                >
                    💬
                    <span>
                        Suggest a reply
                    </span>
                </button>

                <button
                    type="button"
                    class="ai-modal-action"
                    data-ai-action="mood"
                >
                    ❤️
                    <span>
                        Understand mood
                    </span>
                </button>

                <button
                    type="button"
                    class="ai-modal-action"
                    data-ai-action="question"
                >
                    💭
                    <span>
                        Give us a question
                    </span>
                </button>

                <button
                    type="button"
                    class="ai-modal-action"
                    data-ai-action="game"
                >
                    🎮
                    <span>
                        Couple game
                    </span>
                </button>

            </div>

        </section>

    </div>


    <!-- =====================================================
         MENU OVERLAY
    ====================================================== -->
    <div
        class="couple-overlay hidden"
        id="coupleMenuOverlay"
    >

        <section class="couple-menu-panel">

            <div class="couple-panel-header">

                <div>
                    <small>
                        Conversation
                    </small>

                    <h2>
                        Options
                    </h2>
                </div>

                <button
                    type="button"
                    id="closeCoupleMenu"
                >
                    ×
                </button>

            </div>


            <div class="couple-menu-list">

                <button
                    type="button"
                    data-menu-action="export"
                >
                    📥
                    <span>
                        Export chat
                    </span>
                </button>

                <button
                    type="button"
                    data-menu-action="clear"
                >
                    🗑️
                    <span>
                        Clear local chat
                    </span>
                </button>

            </div>

        </section>

    </div>


    <!-- =====================================================
         COMPOSER
    ====================================================== -->
    <footer class="couple-composer-area">

        <form
            class="couple-composer"
            id="coupleComposer"
        >

            <button
                type="button"
                id="coupleEmojiButton"
                class="composer-icon-button"
                aria-label="Emoji"
            >
                😊
            </button>


            <input
                type="text"
                id="coupleMessageInput"
                placeholder="Message your partner..."
                maxlength="4000"
                autocomplete="off"
            >


            <button
                type="button"
                id="coupleAttachButton"
                class="composer-icon-button"
                aria-label="Attach"
            >
                📎
            </button>


            <button
                type="button"
                id="coupleCameraButton"
                class="composer-icon-button"
                aria-label="Camera"
            >
                📷
            </button>


            <button
                type="submit"
                class="couple-send-button"
                id="coupleSendButton"
                aria-label="Send"
            >
                ➤
            </button>

        </form>

    </footer>

</div>


<!-- =====================================================
     HIDDEN FILE INPUT
====================================================== -->
<input
    type="file"
    id="coupleFileInput"
    hidden
    multiple
    accept="image/*,video/*,.pdf,.doc,.docx,.txt"
>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->
<script src="/static/js/couple-realtime.js?v=1"></script>
<script src="/static/js/couple-chat.js?v=4"></script>

</body>
</html>
