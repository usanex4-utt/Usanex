<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#090615"
    >

    <title>Couple Chat | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/couple-chat.css?v=2"
    >
</head>

<body data-couple-mode="calm">

<div class="couple-app" id="coupleApp">

    <!-- =====================================================
         COUPLE HEADER
    ====================================================== -->

    <header class="couple-header">

        <button
            type="button"
            class="couple-back-button"
            id="coupleBackButton"
            aria-label="Back"
        >
            ‹
        </button>


        <button
            type="button"
            class="couple-avatar-button"
            id="coupleAvatarButton"
            aria-label="Open partner profile"
        >

            <img
                id="couplePartnerAvatar"
                src="/static/images/default-profile.png"
                alt="Partner"
            >

            <span
                class="couple-online-dot"
                id="coupleOnlineDot"
                hidden
            ></span>

        </button>


        <div class="couple-header-info">

            <strong
                id="couplePartnerName"
            >
                Partner
            </strong>

            <span
                id="couplePartnerStatus"
            >
                Your Couple Space
            </span>

        </div>


        <div class="couple-header-actions">

            <button
                type="button"
                id="coupleMoodButton"
                aria-label="Change mood"
            >
                😊
            </button>

            <button
                type="button"
                id="coupleMenuButton"
                aria-label="More options"
            >
                ⋮
            </button>

        </div>

    </header>


    <!-- =====================================================
         DYNAMIC MOOD BAR
    ====================================================== -->

    <section
        class="couple-mood-bar"
        id="coupleMoodBar"
    >

        <div class="couple-mood-icon" id="coupleMoodIcon">
            😌
        </div>

        <div class="couple-mood-info">

            <span class="couple-mood-label">
                Current Mood
            </span>

            <strong id="coupleMoodName">
                Calm
            </strong>

        </div>

        <button
            type="button"
            class="couple-mood-change"
            id="coupleMoodChangeButton"
        >
            Change
        </button>

    </section>


    <!-- =====================================================
         AI COUPLE PANEL
    ====================================================== -->

    <section
        class="couple-ai-panel"
        id="coupleAiPanel"
    >

        <div class="couple-ai-icon">
            ✨
        </div>

        <div class="couple-ai-content">

            <strong>
                Usanex Couple AI
            </strong>

            <span id="coupleAiStatus">
                Understanding your conversation...
            </span>

        </div>

        <button
            type="button"
            class="couple-ai-button"
            id="coupleAiButton"
            aria-label="Open Couple AI"
        >
            ✨
        </button>

    </section>


    <!-- =====================================================
         RELATIONSHIP INFO
    ====================================================== -->

    <section
        class="couple-info-card"
        id="coupleInfoCard"
    >

        <div class="couple-info-item">

            <span class="couple-info-icon">
                ❤️
            </span>

            <div>
                <small>
                    Together
                </small>

                <strong id="coupleTogetherDays">
                    Just started
                </strong>
            </div>

        </div>


        <div class="couple-info-divider"></div>


        <div class="couple-info-item">

            <span class="couple-info-icon">
                💕
            </span>

            <div>
                <small>
                    Connection
                </small>

                <strong id="coupleConnectionStatus">
                    Growing
                </strong>
            </div>

        </div>

    </section>


    <!-- =====================================================
         QUICK ACTIONS
    ====================================================== -->

    <section
        class="couple-quick-actions"
        id="coupleQuickActions"
    >

        <button
            type="button"
            class="couple-action"
            data-action="love"
        >
            <span>❤️</span>
            <small>Love</small>
        </button>


        <button
            type="button"
            class="couple-action"
            data-action="memory"
        >
            <span>📸</span>
            <small>Memory</small>
        </button>


        <button
            type="button"
            class="couple-action"
            data-action="question"
        >
            <span>💭</span>
            <small>Question</small>
        </button>


        <button
            type="button"
            class="couple-action"
            data-action="game"
        >
            <span>🎮</span>
            <small>Game</small>
        </button>

    </section>


    <!-- =====================================================
         CONVERSATION
    ====================================================== -->

    <main
        class="couple-conversation"
        id="coupleConversation"
    >

        <div
            class="couple-background-layer"
            id="coupleBackgroundLayer"
            aria-hidden="true"
        ></div>


        <div
            class="couple-effects-layer"
            id="coupleEffectsLayer"
            aria-hidden="true"
        ></div>


        <div
            class="couple-day-label"
            id="coupleDayLabel"
        >
            Today
        </div>


        <section
            class="couple-messages"
            id="coupleMessages"
            aria-live="polite"
        >

            <!-- Messages will be inserted by couple-chat.js -->

        </section>


        <!-- AI SUGGESTIONS -->

        <section
            class="couple-suggestions"
            id="coupleSuggestions"
            hidden
        >

            <div class="couple-suggestions-title">
                AI Suggestions
            </div>

            <div
                class="couple-suggestion-list"
                id="coupleSuggestionList"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         MOOD PANEL
    ====================================================== -->

    <div
        class="couple-overlay hidden"
        id="coupleMoodOverlay"
    >

        <section
            class="couple-mood-panel"
            id="coupleMoodPanel"
        >

            <div class="couple-panel-header">

                <div>
                    <small>
                        Couple Mood
                    </small>

                    <h2>
                        Choose your mood
                    </h2>
                </div>

                <button
                    type="button"
                    id="closeMoodPanel"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <div
                class="couple-mood-grid"
                id="coupleMoodGrid"
            >

                <button data-mode="romantic">
                    ❤️
                    <span>Romantic</span>
                </button>

                <button data-mode="deep-love">
                    🥰
                    <span>Deep Love</span>
                </button>

                <button data-mode="happy">
                    😊
                    <span>Happy</span>
                </button>

                <button data-mode="funny">
                    😂
                    <span>Funny</span>
                </button>

                <button data-mode="sad">
                    😢
                    <span>Sad</span>
                </button>

                <button data-mode="emotional">
                    😭
                    <span>Emotional</span>
                </button>

                <button data-mode="angry">
                    😠
                    <span>Angry</span>
                </button>

                <button data-mode="frustrated">
                    😤
                    <span>Frustrated</span>
                </button>

                <button data-mode="caring">
                    🤗
                    <span>Caring</span>
                </button>

                <button data-mode="comfort">
                    🫂
                    <span>Comfort</span>
                </button>

                <button data-mode="flirty">
                    😘
                    <span>Flirty</span>
                </button>

                <button data-mode="passionate">
                    🔥
                    <span>Passionate</span>
                </button>

                <button data-mode="good-night">
                    🌙
                    <span>Good Night</span>
                </button>

                <button data-mode="good-morning">
                    ☀️
                    <span>Good Morning</span>
                </button>

                <button data-mode="memory">
                    💭
                    <span>Memory</span>
                </button>

                <button data-mode="celebration">
                    🥳
                    <span>Celebration</span>
                </button>

                <button data-mode="birthday">
                    🎂
                    <span>Birthday</span>
                </button>

                <button data-mode="future">
                    💍
                    <span>Future</span>
                </button>

                <button data-mode="missing-you">
                    🫶
                    <span>Missing You</span>
                </button>

                <button data-mode="apology">
                    😔
                    <span>Apology</span>
                </button>

                <button data-mode="appreciation">
                    💕
                    <span>Appreciation</span>
                </button>

                <button data-mode="game">
                    🎮
                    <span>Game</span>
                </button>

                <button data-mode="photo-memory">
                    📸
                    <span>Photos</span>
                </button>

                <button data-mode="serious">
                    🤔
                    <span>Serious Talk</span>
                </button>

                <button data-mode="deep-talk">
                    🧠
                    <span>Deep Talk</span>
                </button>

                <button data-mode="calm">
                    😌
                    <span>Calm</span>
                </button>

            </div>

        </section>

    </div>


    <!-- =====================================================
         AI PANEL
    ====================================================== -->

    <div
        class="couple-overlay hidden"
        id="coupleAiOverlay"
    >

        <section class="couple-ai-modal">

            <div class="couple-panel-header">

                <div>
                    <small>
                        Usanex AI
                    </small>

                    <h2>
                        Couple Assistant
                    </h2>
                </div>

                <button
                    type="button"
                    id="closeAiPanel"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <div class="couple-ai-options">

                <button data-ai-action="suggest">
                    💬
                    <span>
                        Suggest a reply
                    </span>
                </button>

                <button data-ai-action="love">
                    ❤️
                    <span>
                        Make it romantic
                    </span>
                </button>

                <button data-ai-action="comfort">
                    🫂
                    <span>
                        Help me comfort them
                    </span>
                </button>

                <button data-ai-action="game">
                    🎮
                    <span>
                        Start a couple game
                    </span>
                </button>

            </div>

        </section>

    </div>


    <!-- =====================================================
         COMPOSER
    ====================================================== -->

    <footer class="couple-composer-area">

        <div
            class="couple-typing"
            id="coupleTyping"
            hidden
        >
            Partner is typing...
        </div>


        <form
            class="couple-composer"
            id="coupleComposer"
        >

            <button
                type="button"
                id="coupleEmojiButton"
                aria-label="Emoji"
            >
                😊
            </button>


            <input
                type="text"
                id="coupleMessageInput"
                placeholder="Message your partner..."
                maxlength="4000"
                autocomplete="off"
            >


            <button
                type="button"
                id="coupleAttachButton"
                aria-label="Attach"
            >
                📎
            </button>


            <button
                type="button"
                id="coupleCameraButton"
                aria-label="Camera"
            >
                📷
            </button>


            <button
                type="submit"
                class="couple-send-button"
                id="coupleSendButton"
                aria-label="Send"
            >
                ➤
            </button>

        </form>

    </footer>

</div>


<!-- =====================================================
     FILE INPUT
====================================================== -->

<input
    type="file"
    id="coupleFileInput"
    hidden
    multiple
>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script
    src="/static/js/couple-chat.js?v=2"
    defer
></script>

</body>

</html>
