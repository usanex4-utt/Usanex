<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Create Reel | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/reel-upload.css?v=2"
    >
</head>

<body>

<div class="reel-page" id="reelPage">

    <!-- HEADER -->
    <header class="reel-header">

        <button
            type="button"
            class="reel-back"
            id="reelBack"
            aria-label="Go back"
        >
            ‹
        </button>

        <h1>Create Reel</h1>

        <button
            type="button"
            class="reel-next"
            id="reelNext"
        >
            Next
        </button>

    </header>


    <!-- MAIN -->
    <main class="reel-main">

        <!-- VIDEO -->
        <section class="video-section">

            <div
                class="video-preview"
                id="videoPreview"
            >

                <!-- EMPTY -->
                <div
                    class="video-empty"
                    id="videoEmpty"
                >

                    <div class="upload-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                        >
                            <rect
                                x="3"
                                y="4"
                                width="18"
                                height="16"
                                rx="3"
                            ></rect>

                            <path d="M8 4l3 5"></path>
                            <path d="M14 4l3 5"></path>

                            <path d="M10 12l5 3-5 3v-6z"></path>
                        </svg>

                    </div>

                    <h2>Create your Reel</h2>

                    <p>
                        Choose a video from your device
                    </p>

                    <button
                        type="button"
                        class="select-video-button"
                        id="selectVideoButton"
                    >
                        Select Video
                    </button>

                </div>


                <!-- VIDEO -->
                <video
                    id="reelVideo"
                    playsinline
                    preload="metadata"
                    hidden
                ></video>


                <!-- CONTROLS -->
                <div
                    class="video-controls"
                    id="videoControls"
                    hidden
                >

                    <button
                        type="button"
                        id="playPauseButton"
                        aria-label="Play or pause"
                    >
                        ▶
                    </button>

                    <button
                        type="button"
                        id="muteButton"
                        aria-label="Mute or unmute"
                    >
                        🔊
                    </button>

                    <span
                        class="video-duration"
                        id="videoDuration"
                    >
                        0:00
                    </span>

                </div>

            </div>


            <!-- VIDEO ACTIONS -->
            <div
                class="video-actions"
                id="videoActions"
                hidden
            >

                <button
                    type="button"
                    id="replaceVideo"
                >
                    Replace
                </button>

                <button
                    type="button"
                    id="removeVideo"
                >
                    Remove
                </button>

            </div>

        </section>


        <!-- DETAILS -->
        <section class="reel-details">

            <!-- CAPTION -->
            <div class="field-group">

                <div class="field-label-row">

                    <label for="reelCaption">
                        Caption
                    </label>

                    <span id="captionCount">
                        0/40
                    </span>

                </div>

                <textarea
                    id="reelCaption"
                    maxlength="40"
                    rows="2"
                    placeholder="Write something..."
                ></textarea>

            </div>


            <!-- LOCATION -->
            <button
                type="button"
                class="detail-row"
                id="locationButton"
            >

                <span class="detail-left">

                    <span class="detail-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >
                            <path
                                d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="10"
                                r="2.5"
                            ></circle>

                        </svg>

                    </span>

                    <span>

                        <strong>Location</strong>

                        <small id="locationText">
                            Add Location
                        </small>

                    </span>

                </span>

                <span class="detail-arrow">
                    ›
                </span>

            </button>


            <!-- AUDIENCE -->
            <button
                type="button"
                class="detail-row"
                id="audienceButton"
            >

                <span class="detail-left">

                    <span class="detail-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >
                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                            ></circle>

                            <path
                                d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                            ></path>

                        </svg>

                    </span>

                    <span>

                        <strong>Audience</strong>

                        <small id="audienceText">
                            Everyone
                        </small>

                    </span>

                </span>

                <span class="detail-arrow">
                    ›
                </span>

            </button>


            <!-- SETTINGS -->
            <div class="settings-box">

                <div class="setting-row">

                    <span>
                        Allow comments
                    </span>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="commentsToggle"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="setting-row">

                    <span>
                        Allow sharing
                    </span>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="sharingToggle"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="reel-footer">

        <button
            type="button"
            class="post-reel-button"
            id="postReelButton"
            disabled
        >
            Post Reel
        </button>

    </footer>


    <!-- FILE INPUT -->
    <input
        type="file"
        id="videoInput"
        accept="video/mp4,video/webm,video/quicktime,video/*"
        hidden
    >


    <!-- LOCATION OVERLAY -->
    <div
        class="small-overlay"
        id="locationOverlay"
        hidden
    >

        <div class="small-sheet">

            <div class="sheet-handle"></div>

            <div class="small-sheet-header">

                <h2>Add Location</h2>

                <button
                    type="button"
                    class="sheet-close"
                    id="closeLocation"
                >
                    ×
                </button>

            </div>

            <input
                type="text"
                id="locationInput"
                class="location-input"
                maxlength="80"
                placeholder="Search location..."
                autocomplete="off"
            >

            <div
                class="location-results"
                id="locationResults"
            ></div>

        </div>

    </div>


    <!-- AUDIENCE OVERLAY -->
    <div
        class="small-overlay"
        id="audienceOverlay"
        hidden
    >

        <div class="small-sheet audience-sheet">

            <div class="sheet-handle"></div>

            <div class="small-sheet-header">

                <h2>Who can see this?</h2>

                <button
                    type="button"
                    class="sheet-close"
                    id="closeAudience"
                >
                    ×
                </button>

            </div>

            <button
                type="button"
                class="audience-option selected"
                data-audience="Everyone"
            >
                Everyone
            </button>

            <button
                type="button"
                class="audience-option"
                data-audience="Connections"
            >
                Connections
            </button>

            <button
                type="button"
                class="audience-option"
                data-audience="Private"
            >
                Private
            </button>

        </div>

    </div>

</div>


<script
    src="/static/js/reel-upload.js?v=2"
></script>

</body>
</html>
