<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Home | Usanex</title>

    <link
        rel="stylesheet"
        href="/static/css/home.css?v=23"
    >

    <style>
        /* NEXA Personal Assistant bar */
        .nexa-assistant-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 54px;
            box-sizing: border-box;
            padding: 0 17px;
            margin: 0;
            border: 1px solid rgba(91, 151, 255, 0.25);
            border-radius: 18px;
            background: linear-gradient(
                110deg,
                #17243b,
                #171b29
            );
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }

        .nexa-assistant-bar:active {
            transform: scale(0.99);
        }

        .nexa-assistant-search-icon {
            width: 23px;
            height: 23px;
            flex: 0 0 23px;
            color: #80b7ff;
        }

        .nexa-assistant-label {
            flex: 1;
            min-width: 0;
            color: #dce9ff;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1px;
        }

        .nexa-assistant-sparkle {
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            color: #80b7ff;
        }

        .nexa-assistant-area {
            padding: 10px 14px;
            background: inherit;
        }

        @media (min-width: 700px) {
            .nexa-assistant-area {
                padding-left: 20px;
                padding-right: 20px;
            }

            .nexa-assistant-bar {
                max-width: 650px;
                margin: 0 auto;
            }
        }
    </style>

</head>

<body>

<div class="app-shell">

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <button
            type="button"
            class="menu-button"
            id="menuButton"
            aria-label="Open menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="brand">
            <span class="brand-blue">Usa</span><span class="brand-white">nex</span>
        </div>

        <!-- CREATE BUTTON — EXISTING FEATURE -->

        <button
            type="button"
            class="header-plus"
            id="headerPlus"
            aria-label="create"
        >
            +
        </button>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="main-area">

        <div class="content-scroll">

            <!-- ================= NEX MOMENT ================= -->

            <section class="status-section">

                <div class="section-header">
                    <h2>Nex Moment</h2>

                    <button
                        type="button"
                        class="see-all"
                        id="momentSeeAll"
                    >
                        See all
                    </button>
                </div>

                <div class="moments">

                    <div class="moment-item">
                        <div class="moment-avatar your-moment">
                            <div class="moment-plus">+</div>
                        </div>
                        <span>You</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">U</div>
                        <span>Uttam</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">A</div>
                        <span>Aman</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">R</div>
                        <span>Rahul</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">P</div>
                        <span>Priya</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">S</div>
                        <span>Shiv</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">K</div>
                        <span>Karan</span>
                    </div>

                </div>

            </section>


            <!-- ================= CONNECTION CATEGORY ================= -->

            <section
                class="connected-people-section"
                id="connectedPeopleSection"
                hidden
            >

                <div class="connected-section-header">
                    <h2 id="connectedSectionTitle">
                        All Connected
                    </h2>

                    <span
                        class="connected-count"
                        id="connectedPeopleCount"
                    >
                        0
                    </span>
                </div>

                <div
                    class="connected-people-list"
                    id="connectedPeopleList"
                ></div>

            </section>

        </div>

    </main>


    <!-- ================= NEXA ASSISTANT BAR ================= -->
    <!-- Navigation ke bilkul upar -->

    <div class="nexa-assistant-area">

        <button
            type="button"
            class="nexa-assistant-bar"
            id="nexaAssistantButton"
            aria-label="Open Your Personal Assistant"
        >

            <svg
                class="nexa-assistant-search-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
            >
                <circle cx="10.8" cy="10.8" r="7"></circle>
                <path d="m16 16 4.2 4.2"></path>
            </svg>

            <span class="nexa-assistant-label">
                Your Personal Assistant
            </span>

            <svg
                class="nexa-assistant-sparkle"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z"></path>
                <path d="m19 14 1.1 2.9L23 18l-2.9 1.1L19 22l-1.1-2.9L15 18l2.9-1.1L19 14z"></path>
            </svg>

        </button>

    </div>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom-nav">

        <!-- HOME -->
        <button
            type="button"
            class="nav-item active"
            id="homeNav"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5.5 9.5V21h13V9.5"></path>
            </svg>
            <span>Home</span>
        </button>

        <!-- REEL -->
        <button
            type="button"
            class="nav-item"
            id="reelNav"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <path d="M8 4l3 5"></path>
                <path d="M14 4l3 5"></path>
                <path d="M10 12l5 3-5 3v-6z"></path>
            </svg>
            <span>Reel</span>
        </button>

        <!-- SEARCH -->
        <button
            type="button"
            class="nav-item"
            id="searchNav"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-4-4"></path>
            </svg>
            <span>Search</span>
        </button>

        <!-- NOTIFICATION -->
        <button
            type="button"
            class="nav-item"
            id="notificationNav"
        >
            <span class="notification-icon-wrapper">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>

                <span
                    class="notification-dot"
                    id="notificationDot"
                    hidden
                ></span>
            </span>
            <span>Notification</span>
        </button>

        <!-- PROFILE -->
        <button
            type="button"
            class="nav-item"
            id="profileNav"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
            </svg>
            <span>Profile</span>
        </button>

    </nav>


    <!-- ================= SIDE MENU ================= -->

    <div
        class="menu-overlay"
        id="menuOverlay"
        hidden
    >

        <div
            class="menu-panel"
            role="dialog"
            aria-modal="true"
        >

            <div class="menu-header">

                <div class="menu-brand">
                    <span class="brand-blue">Usa</span><span class="brand-white">nex</span>
                </div>

                <button
                    type="button"
                    id="closeMenu"
                    class="close-menu"
                    aria-label="Close menu"
                >
                    ×
                </button>

            </div>

            <div class="menu-items">

                <button type="button" id="menuAllConnected">
                    All Connected
                </button>

                <button type="button" id="menuFamily">
                    Family
                </button>

                <button type="button" id="menuFriends">
                    Friends
                </button>

                <button type="button" id="menuCoupleChat">
                    Couple Chat
                </button>

                <button type="button" id="menuSettings">
                    Settings
                </button>

                <button type="button" id="logoutButton">
                    Logout
                </button>

            </div>

        </div>

    </div>

</div>


<!-- ================= HOME JAVASCRIPT ================= -->

<script src="/static/js/home.js?v=23"></script>

<!-- ================= CREATE BOTTOM SHEET ================= -->

<script src="/static/js/create-sheet.js?v=1"></script>


<!-- ================= NEXA BUTTON NAVIGATION ================= -->

<script>
    document
        .getElementById("nexaAssistantButton")
        .addEventListener("click", function () {
            window.location.href = "/nexa";
        });
</script>
    
<script src="/static/js/nexa-global.js" defer></script>
    

</body>
</html>
