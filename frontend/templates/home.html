<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Home | Usanex</title>

    <link rel="stylesheet" href="/static/css/home.css?v=24">

    <style>
        /* ================= HEADER NEXA ASSISTANT ================= */

        .top-header {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand {
            flex-shrink: 0;
        }

        .header-nexa-button {
            flex: 1;
            min-width: 0;
            height: 39px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 0 8px;
            border: 1px solid rgba(72, 135, 255, .30);
            border-radius: 12px;
            background: linear-gradient(110deg, #111b30, #10121d);
            color: #dce9ff;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .header-nexa-button:active {
            transform: scale(.97);
        }

        .header-nexa-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 8px;
            border-radius: 50%;
            background: #438cff;
        }

        .header-nexa-text {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 12px;
            font-weight: 600;
        }

        .header-plus {
            flex-shrink: 0;
        }

        @media (max-width: 380px) {
            .top-header {
                gap: 6px;
            }

            .header-nexa-button {
                gap: 5px;
                padding: 0 5px;
            }

            .header-nexa-text {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app-shell">

    <!-- HEADER -->

    <header class="top-header">

        <button
            type="button"
            class="menu-button"
            id="menuButton"
            aria-label="Open menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="brand">
            <span class="brand-blue">Usa</span><span class="brand-white">nex</span>
        </div>

        <!-- PERSONAL ASSISTANT IN HEADER -->

        <button
            type="button"
            class="header-nexa-button"
            id="nexaAssistantButton"
            aria-label="Open Your Personal Assistant"
        >
            <span class="header-nexa-dot"></span>
            <span class="header-nexa-text">Personal Assistant</span>
        </button>

        <button
            type="button"
            class="header-plus"
            id="headerPlus"
            aria-label="Create"
        >
            +
        </button>

    </header>


    <!-- MAIN CONTENT -->

    <main class="main-area">

        <div class="content-scroll">

            <!-- NEX MOMENT -->

            <section class="status-section">

                <div class="section-header">
                    <h2>Nex Moment</h2>

                    <button
                        type="button"
                        class="see-all"
                        id="momentSeeAll"
                    >
                        See all
                    </button>
                </div>

                <div class="moments">

                    <div class="moment-item">
                        <div class="moment-avatar your-moment">
                            <div class="moment-plus">+</div>
                        </div>
                        <span>You</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">U</div>
                        <span>Uttam</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">A</div>
                        <span>Aman</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">R</div>
                        <span>Rahul</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">P</div>
                        <span>Priya</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">S</div>
                        <span>Shiv</span>
                    </div>

                    <div class="moment-item">
                        <div class="moment-avatar">K</div>
                        <span>Karan</span>
                    </div>

                </div>
            </section>


            <!-- CONNECTED PEOPLE -->

            <section
                class="connected-people-section"
                id="connectedPeopleSection"
                hidden
            >

                <div class="connected-section-header">
                    <h2 id="connectedSectionTitle">All Connected</h2>

                    <span
                        class="connected-count"
                        id="connectedPeopleCount"
                    >0</span>
                </div>

                <div
                    class="connected-people-list"
                    id="connectedPeopleList"
                ></div>

            </section>

        </div>
    </main>


    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

        <button type="button" class="nav-item active" id="homeNav">
            <svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8">
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5.5 9.5V21h13V9.5"></path>
            </svg>
            <span>Home</span>
        </button>

        <button type="button" class="nav-item" id="reelNav">
            <svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <path d="M8 4l3 5"></path>
                <path d="M14 4l3 5"></path>
                <path d="M10 12l5 3-5 3v-6z"></path>
            </svg>
            <span>Reel</span>
        </button>

        <button type="button" class="nav-item" id="searchNav">
            <svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-4-4"></path>
            </svg>
            <span>Search</span>
        </button>

        <button type="button" class="nav-item" id="notificationNav">
            <span class="notification-icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8">
                    <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>

                <span
                    class="notification-dot"
                    id="notificationDot"
                    hidden
                ></span>
            </span>
            <span>Notification</span>
        </button>

        <button type="button" class="nav-item" id="profileNav">
            <svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
            </svg>
            <span>Profile</span>
        </button>

    </nav>


    <!-- SIDE MENU -->

    <div class="menu-overlay" id="menuOverlay" hidden>

        <div class="menu-panel" role="dialog" aria-modal="true">

            <div class="menu-header">

                <div class="menu-brand">
                    <span class="brand-blue">Usa</span><span class="brand-white">nex</span>
                </div>

                <button
                    type="button"
                    id="closeMenu"
                    class="close-menu"
                    aria-label="Close menu"
                >×</button>

            </div>

            <div class="menu-items">

                <button type="button" id="menuAllConnected">All Connected</button>
                <button type="button" id="menuFamily">Family</button>
                <button type="button" id="menuFriends">Friends</button>
                <button type="button" id="menuCoupleChat">Couple Chat</button>
                <button type="button" id="menuSettings">Settings</button>
                <button type="button" id="logoutButton">Logout</button>

            </div>
        </div>
    </div>

</div>


<!-- EXISTING HOME FEATURES -->
    <script>
    document.getElementById("nexaAssistantButton")
        .addEventListener("click", function () {
            window.location.href = "/nexa";
        });
</script>

<script src="/static/js/nexa-global.js?v=2" defer></script>

<script src="/static/js/home.js?v=24"></script>
<script src="/static/js/create-sheet.js?v=1"></script>

<!-- NEXA PAGE NAVIGATION -->


</body>
</html>
