
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#080b14">

    <title>Home | UtaNexa</title>

    <link
        rel="stylesheet"
        href="/static/css/home.css?v=27"
    >
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <!-- MENU -->
        <button
            type="button"
            class="menu-button"
            id="menuButton"
            aria-label="Open menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- CENTER BRAND -->
        <a
            href="/home"
            class="brand brand-centered"
            aria-label="UtaNexa Home"
        >
            <span class="brand-uta">UTA</span><span class="brand-nexa">NEXA</span>
        </a>

        <!-- CREATE -->
        <button
            type="button"
            class="header-plus"
            id="headerPlus"
            aria-label="Create"
        >
            +
        </button>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="home-main" id="homeMain">

        <!-- NEX MOMENTS -->
        <section
            class="moment-section"
            id="momentSection"
        >

            <div class="section-heading">

                <h2>Nex Moments</h2>

                <button
                    type="button"
                    class="see-all-button"
                    id="momentSeeAll"
                >
                    See all
                </button>

            </div>

            <div
                class="moment-list"
                id="momentList"
            >
                <!-- Moments are loaded by existing app code -->
            </div>

        </section>


        <!-- CONNECTED PEOPLE -->
        <section
            class="connected-people-section"
            id="connectedPeopleSection"
            hidden
        >

            <div class="section-heading">

                <h2 id="connectedSectionTitle">
                    All Connected
                </h2>

                <span
                    class="connected-count"
                    id="connectedPeopleCount"
                >
                    0
                </span>

            </div>

            <div
                class="connected-people-list"
                id="connectedPeopleList"
            >
                <!-- Connections are rendered by home.js -->
            </div>

        </section>

    </main>


    <!-- ================= BOTTOM NAVIGATION ================= -->

    <nav
        class="bottom-nav"
        aria-label="Main navigation"
    >

        <button
            type="button"
            class="nav-item active"
            id="homeNav"
            aria-label="Home"
        >
            <span class="nav-icon">⌂</span>
            <span class="nav-label">Home</span>
        </button>

        <button
            type="button"
            class="nav-item"
            id="reelNav"
            aria-label="Reels"
        >
            <span class="nav-icon">▷</span>
            <span class="nav-label">Reel</span>
        </button>

        <button
            type="button"
            class="nav-item"
            id="searchNav"
            aria-label="Search"
        >
            <span class="nav-icon">⌕</span>
            <span class="nav-label">Search</span>
        </button>

        <button
            type="button"
            class="nav-item"
            id="notificationNav"
            aria-label="Notifications"
        >
            <span class="nav-icon">♧</span>
            <span class="nav-label">Alerts</span>
        </button>

        <button
            type="button"
            class="nav-item"
            id="profileNav"
            aria-label="My profile"
        >
            <span class="nav-icon">○</span>
            <span class="nav-label">Profile</span>
        </button>

    </nav>


    <!-- ================= SIDE MENU ================= -->

    <div
        class="menu-overlay"
        id="menuOverlay"
        hidden
    >

        <aside
            class="side-menu"
            role="dialog"
            aria-modal="true"
            aria-label="Navigation menu"
        >

            <div class="side-menu-header">

                <div class="side-menu-brand">
                    <span class="brand-uta">UTA</span><span class="brand-nexa">NEXA</span>
                </div>

                <button
                    type="button"
                    id="closeMenu"
                    class="close-menu-button"
                    aria-label="Close menu"
                >
                    ×
                </button>

            </div>


            <div class="side-menu-options">

                <button
                    type="button"
                    class="menu-option"
                    id="menuAllConnected"
                >
                    <span>♧</span>
                    <span>All Connected</span>
                </button>

                <button
                    type="button"
                    class="menu-option"
                    id="menuFamily"
                >
                    <span>♡</span>
                    <span>Family</span>
                </button>

                <button
                    type="button"
                    class="menu-option"
                    id="menuFriends"
                >
                    <span>♙</span>
                    <span>Friends</span>
                </button>

                <button
                    type="button"
                    class="menu-option"
                    id="menuCoupleChat"
                >
                    <span>♥</span>
                    <span>Couple Chat</span>
                </button>

                <button
                    type="button"
                    class="menu-option"
                    id="menuSettings"
                >
                    <span>⚙</span>
                    <span>Settings</span>
                </button>

            </div>


            <button
                type="button"
                class="logout-button"
                id="logoutButton"
            >
                Log out
            </button>

        </aside>

    </div>


    <!-- ================= SCRIPTS ================= -->

    <script src="/static/js/home.js?v=25" defer></script>

    <script src="/static/js/create-sheet.js?v=1" defer></script>

    <script src="/static/js/nexa-global.js?v=3" defer></script>

</body>
</html>
